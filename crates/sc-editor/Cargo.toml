[package]
name = "sc-editor"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository.workspace = true
description = "The code editor widget: a fork of iced-code-editor 0.3.11, carrying the changes the editor and the plugin API need."

[features]
lsp-process = ["dep:serde_json"]
two-face = ["dep:two-face"]
# Exposes internal hot-path functions for the criterion benchmark harness.
bench = []

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "advanced", "image"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", optional = true }
web-time = "1"
iced_font_awesome = "0.4"
iced_aw = "0.13"
rust-i18n = "3"
unicode-width = "0.2.2"
serde_json = { version = "1", optional = true }
