[package]
name = "sc-proto"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types and errors for smart-coder."

[dependencies]
# The only dependency, and only because the wire types cross a network. Kept
# deliberately small: `smart-coder-web` vendors this crate as a submodule to
# obtain the daemon protocol, and every dependency added here is one that lands
# in the public server's build.
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
