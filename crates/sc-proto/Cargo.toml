[package]
name = "sc-proto"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types and errors for smart-coder."

[dependencies]
# The only dependency, and only because the wire types cross a network. Kept
# deliberately small: `sc-server` takes this crate and nothing else from the
# workspace, so every dependency added here lands in the public server's build.
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
