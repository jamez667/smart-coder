[package]
name = "sc-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The hosted intake surface: file a request, read a drafted spec, approve or send back (spec 18)."

[[bin]]
name = "sc-server"
path = "src/main.rs"

[dependencies]
# The ONLY workspace dependency, and deliberately so. `sc-proto` carries the
# daemon protocol and nothing else, so this server links no model stack, no
# workflow engine, and no filesystem access to a repository — which is what makes
# "no model is anywhere near the public server" literally true rather than true
# in spirit.
#
# This is the line that matters, not the repository boundary: living in the same
# workspace as the agent costs the server nothing, because `cargo build -p
# sc-server` compiles this tree and no other. Both ends share one definition of
# the protocol rather than restating it, so it cannot drift (spec 17's failure,
# prevented by construction).
sc-proto = { path = "../sc-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
# The screener's eval corpus, compiled in via `include_str!` so it travels with
# the binary and runs inside the container.
toml = { workspace = true }
tiny_http = "0.12"
getrandom = "0.3"
sha2 = "0.10"
# Outbound HTTP for the spam screener and the mailer. Synchronous, matching the
# rest of the workspace — there is no async runtime outside the GUI. Declared
# explicitly rather than relied on transitively via sc-daemon.
ureq = { version = "3", features = ["json"] }
