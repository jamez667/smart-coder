[package]
name = "sc-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The hosted intake surface: file a request, read a drafted spec, approve or send back (spec 18)."

[[bin]]
name = "sc-server"
path = "src/main.rs"

[dependencies]
sc-proto = { path = "../sc-proto" }
# The wire types live in sc-daemon and are shared, not restated — the two ends
# cannot drift if there is only one definition (spec 17's failure, prevented).
sc-daemon = { path = "../sc-daemon" }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = "0.12"
getrandom = "0.3"
sha2 = "0.10"
