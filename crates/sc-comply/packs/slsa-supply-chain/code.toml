# slsa-supply-chain — code controls.
#
# Evidence lives in source files. Owned by engineers.
#
# The section is taken from THIS FILENAME, not from any `section =` key,
# so the directory layout and the score cannot disagree.
# See docs/specs/13-compliance-evidence.md.

[[controls]]
id        = "SBOM-2"
title     = "Dependencies are pinned and their integrity verified"
clause    = "SLSA dependency track / SSDF PW.4"
severity  = "critical"
aggregate = "weighted"
pass_at   = 0.6
gap_below = 0.3
intent    = """
Dependency resolution is reproducible and component integrity is verified, so a
compromised or substituted upstream artifact is detected rather than silently
consumed.
"""
remediation = """
Commit lockfiles, enable a vulnerability audit in CI, and prefer registries that
support integrity hashes.
"""

  [[controls.checks]]
  id          = "lockfile-committed"
  kind        = "file-exists"
  paths       = ["Cargo.lock", "package-lock.json", "yarn.lock", "pnpm-lock.yaml", "poetry.lock", "go.sum", "Gemfile.lock", "composer.lock", "Pipfile.lock"]
  weight      = 3.0
  on_match    = "pass"
  on_no_match = "gap"
  rationale   = "A lockfile makes resolution reproducible — the precondition for knowing what shipped."

  [[controls.checks]]
  id          = "integrity-hashes-present"
  kind        = "regex-match-in-glob"
  glob        = "{package-lock.json,yarn.lock,pnpm-lock.yaml,Cargo.lock,go.sum,poetry.lock}"
  pattern     = "(?i)(\"integrity\"\\s*:\\s*\"sha(256|512)-|checksum\\s*=\\s*\"|h1:|sha256:)"
  weight      = 2.0
  on_match    = "pass"
  on_no_match = "unknown"
  on_no_files = "unknown"
  rationale   = "Per-component integrity hashes in the lockfile detect substitution upstream."

  [[controls.checks]]
  id          = "vulnerability-audit-in-ci"
  kind        = "regex-match-in-glob"
  glob        = "{.github/workflows/*.{yml,yaml},.woodpecker/*.{yml,yaml},.gitlab-ci.yml}"
  pattern     = "(?i)(cargo[- ]audit|cargo[- ]deny|pip-audit|npm audit|osv-scanner|grype|trivy|snyk|dependency-check)"
  weight      = 2.0
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "unknown"
  rationale   = "Continuous checking that pinned components have not since been found vulnerable."
