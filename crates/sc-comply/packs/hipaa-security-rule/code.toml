# hipaa-security-rule — code controls.
#
# Evidence lives in source files. Owned by engineers.
#
# The section is taken from THIS FILENAME, not from any `section =` key,
# so the directory layout and the score cannot disagree.
# See docs/specs/13-compliance-evidence.md.

[[controls]]
id        = "164.312(e)(1)"
title     = "Transmission security"
clause    = "45 CFR 164.312(e)(1), (e)(2)(ii)"
severity  = "critical"
aggregate = "all"
intent    = """
Implement technical security measures to guard against unauthorized access to
electronic protected health information being transmitted over an electronic
communications network. Encryption is an addressable implementation
specification.
"""
remediation = """
Enforce TLS on every endpoint that may carry ePHI and remove any code path that
disables certificate verification. If encryption is not implemented, document
the addressable-specification rationale.
"""

  [[controls.checks]]
  id          = "no-tls-verification-disabled"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb}"
  pattern     = "(?i)(verify\\s*=\\s*False|danger_accept_invalid_certs\\s*\\(\\s*true|rejectUnauthorized\\s*:\\s*false|InsecureSkipVerify\\s*:\\s*true|CURLOPT_SSL_VERIFYPEER\\s*,\\s*(0|false))"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = """
Disabling certificate verification defeats transmission security regardless of
the addressable/required distinction — there is no rationale under which it is
reasonable.
"""

  [[controls.checks]]
  id          = "no-plaintext-transport"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,yml,yaml,tf}"
  pattern     = "http://[a-zA-Z0-9][a-zA-Z0-9.-]*\\.(com|org|net|io|dev|co|ai|cloud|app)\\b"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Plaintext transport to a public host. Whether ePHI traverses it is not determinable here."

[[controls]]
id        = "164.312(a)(2)(iv)"
title     = "Encryption and decryption of ePHI at rest"
clause    = "45 CFR 164.312(a)(2)(iv)"
severity  = "critical"
aggregate = "all"
intent    = """
Implement a mechanism to encrypt and decrypt electronic protected health
information. This is an addressable implementation specification: a covered
entity may document why an alternative measure is reasonable and appropriate.
"""
remediation = """
Enable storage encryption for any datastore holding ePHI, or document the
addressable rationale. Replace deprecated cryptographic primitives.
"""

  [[controls.checks]]
  id          = "no-broken-cryptography"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb,php}"
  pattern     = "(?i)(hashlib\\.(md5|sha1)\\s*\\(|MD5\\.Create\\s*\\(|md5\\.New\\s*\\(|DES\\.new\\s*\\(|Cipher\\.getInstance\\s*\\(\\s*\"(DES|RC4))"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Deprecated primitives cannot constitute the required encryption mechanism."

  [[controls.checks]]
  id          = "encryption-at-rest-declared"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{tf,yml,yaml,json}"
  pattern     = "(?i)(encrypted\\s*[:=]\\s*true|storage_encrypted|server_side_encryption|kms_key_id|encryption_at_rest)"
  on_match    = "unknown"
  on_no_match = "unknown"
  on_no_files = "unknown"
  # Unconditional: finding encryption config says nothing about whether the
  # encrypted store is the one holding ePHI.
  rationale   = """
Storage encryption may be declared in infrastructure code, but this tool cannot
determine whether the encrypted store holds ePHI — which is the whole question.
Reported Unknown unconditionally; the assessor must map ePHI to datastores.
"""

[[controls]]
id        = "164.312(b)"
title     = "Audit controls"
clause    = "45 CFR 164.312(b)"
severity  = "high"
aggregate = "all"
intent    = """
Implement hardware, software, and/or procedural mechanisms that record and
examine activity in information systems that contain or use electronic protected
health information.
"""
remediation = "Adopt structured logging with user and record identifiers; ship logs to protected retention."

  [[controls.checks]]
  id          = "application-logging-present"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{rs,py,cs,ts,js,go,java}"
  pattern     = "\\b(tracing::|log::(info|warn|error)|logging\\.getLogger|ILogger<|winston|zap\\.|slog\\.|logrus)"
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "unknown"
  rationale   = """
The application records activity. Whether those records capture ePHI ACCESS
specifically — which is what §164.312(b) requires — is not determinable from the
presence of a logging call.
"""

[[controls]]
id        = "164.312(a)(1)"
title     = "Access control — unique user identification"
clause    = "45 CFR 164.312(a)(1), (a)(2)(i)"
severity  = "critical"
aggregate = "all"
intent    = """
Implement technical policies and procedures that allow access only to those
persons or software programs granted access rights, including assigning a unique
name or number for identifying and tracking user identity.
"""
remediation = """
Move credentials to a managed secret store; shared or hardcoded credentials
defeat unique user identification entirely.
"""

  [[controls.checks]]
  id          = "no-hardcoded-credentials"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb,php,yml,yaml,toml,json,tf,sh,ps1}"
  pattern     = "(?i)(aws_secret_access_key\\s*[:=]|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|xox[baprs]-[0-9A-Za-z-]{10,})"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  # This control is about what was COMMITTED; a gitignored file is not.
  tracked_only = true
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "A shared hardcoded credential makes unique user identification impossible."

  [[controls.checks]]
  id          = "no-committed-private-keys"
  kind        = "regex-must-not-match"
  glob        = "**/*"
  pattern     = "-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*", "**/*.snap"]
  # This control is about what was COMMITTED; a gitignored file is not.
  tracked_only = true
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Access control begins with keys not being readable by everyone with repository access."
