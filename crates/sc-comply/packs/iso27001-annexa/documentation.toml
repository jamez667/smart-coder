# iso27001-annexa — documentation controls.
#
# Evidence is a document committed to this repository. A published
# document evidences that the document exists, never that it is followed.
#
# The section is taken from THIS FILENAME, not from any `section =` key,
# so the directory layout and the score cannot disagree.
# See docs/specs/13-compliance-evidence.md.

[[controls]]
id        = "A.8.25"
title     = "Secure development life cycle"
clause    = "ISO 27001 A.8.25"
severity  = "high"
aggregate = "any"
intent    = """
Rules for the secure development of software and systems shall be established
and applied.
"""
remediation = "Document the SDLC and evidence its gates in the pipeline."

  [[controls.checks]]
  id          = "sdlc-documented"
  kind        = "file-exists"
  paths       = ["CONTRIBUTING.md", "docs/CONTRIBUTING.md", "docs/development.md", "docs/sdlc.md", "docs/specs"]
  on_match    = "pass"
  on_no_match = "unknown"
  rationale   = "Documented development process. Presence evidences documentation, not adherence."

  [[controls.checks]]
  id          = "automated-quality-gate"
  kind        = "regex-match-in-glob"
  glob        = "{.github/workflows/*.{yml,yaml},.woodpecker/*.{yml,yaml},scripts/check.*}"
  pattern     = "(?i)(fmt --check|clippy|lint|test)"
  on_match    = "pass"
  on_no_match = "unknown"
  on_no_files = "unknown"
  rationale   = "An enforced quality gate in the development lifecycle."

[[controls]]
id        = "A.5.1"
title     = "Policies for information security"
clause    = "ISO 27001 A.5.1"
severity  = "medium"
aggregate = "all"
intent    = """
Information security policy and topic-specific policies shall be defined,
approved by management, published, communicated to and acknowledged by relevant
personnel, and reviewed at planned intervals.
"""
remediation = "Provide the approved policy set, communication records, and acknowledgement evidence."

  [[controls.checks]]
  id          = "policy-document-present"
  kind        = "file-exists"
  paths       = ["SECURITY.md", "docs/SECURITY.md", ".github/SECURITY.md", "docs/policies"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
A repository may hold policy text, but cannot evidence management approval,
communication, personnel acknowledgement, or periodic review. The auditor must
obtain the approved policy set and its acknowledgement records.
"""
