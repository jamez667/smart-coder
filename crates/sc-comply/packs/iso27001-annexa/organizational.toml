# iso27001-annexa — organizational controls.
#
# Evidence lives outside the repository entirely: HR systems,
# contracts, board minutes, training records. These resolve to `unknown` by
# construction — that is the honest answer, and why they are declared rather
# than omitted.
#
# The section is taken from THIS FILENAME, not from any `section =` key,
# so the directory layout and the score cannot disagree.
# See docs/specs/13-compliance-evidence.md.

[[controls]]
id        = "A.5.15"
title     = "Access control"
clause    = "ISO 27001 A.5.15"
severity  = "high"
aggregate = "all"
intent    = """
Rules to control physical and logical access to information and other associated
assets shall be established and implemented based on business and information
security requirements.
"""
remediation = "Provide the identity provider configuration and access review records."

  [[controls.checks]]
  id          = "repository-access-rules"
  kind        = "file-exists"
  paths       = ["CODEOWNERS", ".github/CODEOWNERS", ".github/settings.yml"]
  on_match    = "unknown"
  on_no_match = "unknown"
  # Repository ownership is a sliver of access control; the identity provider is
  # where the control actually lives.
  rationale   = """
CODEOWNERS covers review routing, not access provisioning, review or revocation.
Those live in the identity provider. Reported Unknown; the auditor must obtain
IdP configuration and access review records.
"""

[[controls]]
id        = "A.5.19"
title     = "Information security in supplier relationships"
clause    = "ISO 27001 A.5.19"
severity  = "medium"
aggregate = "all"
intent    = """
Processes and procedures shall be defined and implemented to manage the
information security risks associated with the use of supplier products or
services.
"""
remediation = "Provide the supplier register, due-diligence records, and contractual security terms."

  [[controls.checks]]
  id          = "dependency-inventory-present"
  kind        = "file-exists"
  paths       = ["Cargo.lock", "package-lock.json", "poetry.lock", "go.sum", "sbom.json", "sbom.xml"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
A lockfile inventories software dependencies, not supplier relationships. Due
diligence, contracts and supplier risk assessments are not source-controlled.
Reported Unknown unconditionally.
"""

[[controls]]
id        = "A.6.3"
title     = "Information security awareness, education and training"
clause    = "ISO 27001 A.6.3"
severity  = "medium"
aggregate = "all"
intent    = """
Personnel and relevant interested parties shall receive appropriate information
security awareness, education and training, and regular updates of policies and
procedures relevant to their job function.
"""
remediation = "Provide training completion records from the LMS or HR system."

  [[controls.checks]]
  id          = "training-material-present"
  kind        = "file-exists"
  paths       = ["docs/security-training.md", "docs/onboarding.md", "CONTRIBUTING.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
Training completion is recorded in an LMS or HR system, never in a repository.
Reported Unknown unconditionally.
"""

[[controls]]
id        = "A.5.24"
title     = "Information security incident management planning and preparation"
clause    = "ISO 27001 A.5.24"
severity  = "high"
aggregate = "all"
intent    = """
The organization shall plan and prepare for managing information security
incidents by defining, establishing and communicating incident management
processes, roles and responsibilities.
"""
remediation = "Provide the incident response plan, on-call rota, and post-incident reviews."

  [[controls.checks]]
  id          = "incident-runbook-present"
  kind        = "file-exists"
  paths       = ["docs/incident-response.md", "docs/runbook.md", "SECURITY.md", ".github/SECURITY.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
A runbook evidences a document. Incident tickets, on-call rotas and post-incident
reviews evidence the process, and they live outside version control. Reported
Unknown unconditionally.
"""

[[controls]]
id        = "A.7.1"
title     = "Physical security perimeters"
clause    = "ISO 27001 A.7.1"
severity  = "medium"
aggregate = "all"
intent    = """
Security perimeters shall be defined and used to protect areas that contain
information and other associated assets.
"""
remediation = "Provide facility documentation, access logs, and (for cloud) the provider's audited reports."

  [[controls.checks]]
  id          = "physical-security-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/physical-security.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  # Present so the report shows the control exists and was consciously excluded.
  rationale   = """
Physical security is not observable from a repository under any circumstances.
Declared here so the evidence pack does not imply the Annex A physical theme was
examined. For cloud-hosted systems this inherits from the provider's own audit.
"""

[[controls]]
id        = "A.5.30"
title     = "ICT readiness for business continuity"
clause    = "ISO 27001 A.5.30"
severity  = "medium"
aggregate = "all"
intent    = """
ICT readiness shall be planned, implemented, maintained and tested based on
business continuity objectives and ICT continuity requirements.
"""
remediation = "Provide the continuity plan and evidence of continuity/DR testing."

  [[controls.checks]]
  id          = "continuity-plan-present"
  kind        = "file-exists"
  paths       = ["docs/business-continuity.md", "docs/disaster-recovery.md", "docs/dr.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
A plan document cannot evidence that continuity was TESTED, which is what this
control requires. Reported Unknown unconditionally; the auditor must obtain DR
test results.
"""
