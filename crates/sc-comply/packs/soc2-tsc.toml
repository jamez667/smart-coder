# SOC 2 Trust Services Criteria — source-controlled evidence pack.
#
# Globs and paths in this file address the AUDITED WORKSPACE, not this file's
# location. See docs/specs/13-compliance-evidence.md.
#
# Authoring rules, learned the hard way:
#
#   * Every check declares on_match AND on_no_match. Where "we could not look"
#     differs from "we looked and it was absent", it also declares on_no_files.
#     Letting on_no_files default is how a compliance tool quietly lies.
#   * Organizational controls are declared here as explicit Unknown rather than
#     omitted. A pack that drops CC1-CC5 lets a reader believe the coverage is
#     complete when ~85% of the framework was never examined.

[framework]
id        = "soc2-tsc-2017"
name      = "SOC 2 Trust Services Criteria (2017, rev. 2022)"
version   = "1.0.0"
authority = "AICPA"
scope_note = """
This pack inspects source-controlled artifacts only. It cannot observe running
infrastructure, cloud provider configuration, identity provider settings, HR
processes, vendor agreements, or incident records. Controls depending on those
are reported Unknown by design and appear in the manual-evidence worklist.

Roughly five of the thirty-three common-criteria points yield deterministic
source evidence. A passing result here is evidence toward a control, never an
attestation of compliance.
"""

# ─────────────────────────────────────────────────────────────────────────────
# CC6.1 — Logical access security
# ─────────────────────────────────────────────────────────────────────────────
[[controls]]
id        = "CC6.1"
title     = "Logical access — credentials are not committed to source"
clause    = "TSC CC6.1"
severity  = "critical"
aggregate = "all"
intent    = """
The entity implements logical access security software, infrastructure, and
architectures over protected information assets to protect them from security
events. Credentials committed to version control defeat every downstream access
control, because the repository history retains them after deletion.
"""
remediation = """
Rotate any exposed credential immediately — deleting the file is not sufficient,
as the value remains in git history. Then add the path to .gitignore and adopt a
secret scanner as a pre-commit hook.
"""

  [[controls.checks]]
  id          = "no-committed-private-keys"
  kind        = "regex-must-not-match"
  glob        = "**/*"
  pattern     = "-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"
  # A secret detector inevitably matches its own detector. Without these, this
  # tool's own fixtures and pattern definitions dominate the findings list and
  # bury the genuine one — which is how a scanner trains its readers to ignore
  # it. Every suppression is disclosed in the report.
  exclude_globs = [
    "crates/sc-comply/packs/*.toml",
    "crates/sc-comply/src/**/*",
    "**/*.snap",
  ]
  on_match    = "gap"
  on_no_match = "pass"
  rationale   = "A committed private key is a direct CC6.1 failure."

  [[controls.checks]]
  id          = "no-hardcoded-cloud-credentials"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb,php,yml,yaml,toml,json,tf,sh,ps1}"
  pattern     = "(?i)(aws_secret_access_key\\s*[:=]|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN OPENSSH|ghp_[0-9A-Za-z]{36})"
  exclude_globs = [
    "crates/sc-comply/packs/*.toml",
    "crates/sc-comply/src/**/*",
  ]
  on_match    = "gap"
  on_no_match = "pass"
  rationale   = "Long-lived static credentials embedded in tracked files."

  [[controls.checks]]
  id          = "env-file-not-tracked"
  kind        = "file-absent"
  path        = ".env"
  on_match    = "gap"
  on_no_match = "pass"
  rationale   = "A tracked .env commonly carries live credentials."

  [[controls.checks]]
  id          = "gitignore-excludes-secrets"
  kind        = "regex-match-in-glob"
  glob        = ".gitignore"
  pattern     = "(?m)^\\s*[/*]*\\.?(env|\\*\\.pem|\\*\\.key|secrets?)"
  on_match    = "pass"
  on_no_match = "gap"
  # No .gitignore at all: we cannot distinguish "no policy" from "policy lives
  # elsewhere", so we decline to call it either way.
  on_no_files = "unknown"
  rationale   = "Preventive control: secrets excluded from version control."

  [[controls.checks]]
  id          = "secret-scanning-configured"
  kind        = "file-exists"
  paths       = [".gitleaks.toml", ".github/workflows/gitleaks.yml", ".pre-commit-config.yaml", ".secrets.baseline", "trufflehog.yaml"]
  on_match    = "pass"
  on_no_match = "gap"
  rationale   = "Automated secret detection prevents recurrence."

# ─────────────────────────────────────────────────────────────────────────────
# CC6.6 — Encryption in transit
# ─────────────────────────────────────────────────────────────────────────────
[[controls]]
id        = "CC6.6"
title     = "Encryption of data in transit"
clause    = "TSC CC6.6"
severity  = "critical"
# Several mechanisms are individually sufficient, so any one is evidence.
aggregate = "any"
intent    = """
The entity implements logical access security measures to protect against
threats from sources outside its system boundaries, including encryption of
data transmitted over public networks.
"""
remediation = """
Enforce TLS 1.2 or higher on every external endpoint and remove any code path
that disables certificate verification.
"""

  [[controls.checks]]
  id          = "no-tls-verification-disabled"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb}"
  pattern     = "(?i)(verify\\s*=\\s*False|danger_accept_invalid_certs\\s*\\(\\s*true|rejectUnauthorized\\s*:\\s*false|InsecureSkipVerify\\s*:\\s*true|CURLOPT_SSL_VERIFYPEER\\s*,\\s*(0|false))"
  on_match    = "gap"
  on_no_match = "pass"
  rationale   = "Disabling certificate verification voids transit encryption."

  [[controls.checks]]
  id          = "tls-minimum-version-configured"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{conf,yml,yaml,tf,toml,json}"
  pattern     = "(?i)(ssl_protocols\\s+TLSv1\\.[23]|minimum_protocol_version|min_tls_version|MinimumTlsVersion|ssl_min_version)"
  on_match    = "pass"
  on_no_match = "unknown"
  on_no_files = "unknown"
  rationale   = "An explicit TLS floor. Absence may only mean the platform sets it."

  [[controls.checks]]
  id          = "no-plaintext-http-endpoints"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,yml,yaml,tf}"
  # Written WITHOUT look-around: the `regex` crate does not support it, so
  # "http:// not followed by localhost" is inexpressible. Instead this matches
  # a hostname bearing a public TLD, which excludes localhost, bare loopback
  # IPs and most namespace URIs by construction.
  #
  # Known false positives: documentation URLs on real domains, and the reserved
  # example.com/.org/.net. Excluding those needs negative look-ahead, so they
  # are accepted as noise rather than silently dropping real findings. An
  # auditor reading a hit on example.com can dismiss it in one glance; a missed
  # plaintext endpoint is the far costlier error.
  pattern     = "http://[a-zA-Z0-9][a-zA-Z0-9.-]*\\.(com|org|net|io|dev|co|ai|cloud|app)\\b"
  on_match    = "gap"
  on_no_match = "pass"
  rationale   = """
Outbound plaintext HTTP to a public host. Localhost, loopback and namespace URIs
are excluded by requiring a public TLD.
"""

# ─────────────────────────────────────────────────────────────────────────────
# CC7.2 — System monitoring
# ─────────────────────────────────────────────────────────────────────────────
[[controls]]
id        = "CC7.2"
title     = "System monitoring for anomalies"
clause    = "TSC CC7.2"
severity  = "medium"
aggregate = "majority"
intent    = """
The entity monitors system components and the operation of those components for
anomalies indicative of malicious acts, natural disasters, and errors affecting
the entity's ability to meet its objectives.
"""
remediation = """
Adopt structured logging with a correlation id, and route alerts to an on-call
destination. Evidence of the alert routing usually lives outside the repo.
"""

  [[controls.checks]]
  id          = "structured-logging-present"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{rs,py,cs,ts,js,go}"
  pattern     = "\\b(tracing::|log::(info|warn|error)|logging\\.getLogger|ILogger<|winston|zap\\.|slog\\.)"
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "unknown"
  rationale   = "The application emits logs usable for monitoring."

  [[controls.checks]]
  id          = "error-handling-entry-point"
  kind        = "symbol-exists"
  name_pattern = "(?i)(handle_error|on_error|ErrorHandler|report_panic|init_tracing|setup_logging)"
  languages    = ["rust", "python", "csharp"]
  on_match     = "pass"
  on_no_match  = "unknown"
  on_no_files  = "unknown"
  rationale    = "A named error/telemetry entry point in indexable source."

  [[controls.checks]]
  id          = "alerting-configured"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{yml,yaml,tf,json}"
  pattern     = "(?i)(alertmanager|pagerduty|opsgenie|sentry|cloudwatch_metric_alarm|prometheusrule|datadog_monitor)"
  on_match    = "pass"
  on_no_match = "unknown"
  on_no_files = "unknown"
  rationale   = "Alert routing is frequently external; absence is not evidence."

# ─────────────────────────────────────────────────────────────────────────────
# CC8.1 — Change management
# ─────────────────────────────────────────────────────────────────────────────
[[controls]]
id        = "CC8.1"
title     = "Change management"
clause    = "TSC CC8.1"
severity  = "high"
# Evidence here is not equally weighted: an enforced CI gate is a far stronger
# signal than a CONTRIBUTING.md describing one.
aggregate = "weighted"
pass_at   = 0.75
gap_below = 0.40
intent    = """
The entity authorizes, designs, develops or acquires, configures, documents,
tests, approves, and implements changes to infrastructure, data, software, and
procedures to meet its objectives.
"""
remediation = """
Require pull-request review and a green automated test run before merge, and
retain the configuration as code where the provider allows it.
"""

  [[controls.checks]]
  id          = "ci-pipeline-defined"
  kind        = "file-exists"
  paths       = [".github/workflows", ".woodpecker", ".gitlab-ci.yml", "azure-pipelines.yml", "Jenkinsfile", ".circleci/config.yml"]
  weight      = 3.0
  on_match    = "pass"
  on_no_match = "gap"
  rationale   = "An automated build/test pipeline runs on change."

  [[controls.checks]]
  id          = "ci-runs-tests"
  kind        = "regex-match-in-glob"
  glob        = "{.github/workflows/*.{yml,yaml},.woodpecker/*.{yml,yaml},.gitlab-ci.yml,azure-pipelines.yml,.circleci/config.yml}"
  pattern     = "(?i)(cargo test|pytest|dotnet test|npm (run )?test|go test|mvn test|check\\.(sh|ps1))"
  weight      = 3.0
  on_match    = "pass"
  on_no_match = "gap"
  # No CI definition at all IS the change-management gap, not an unknown.
  on_no_files = "gap"
  rationale   = "The testing gate is evidenced in the pipeline definition."

  [[controls.checks]]
  id          = "contribution-process-documented"
  kind        = "file-exists"
  paths       = ["CONTRIBUTING.md", "docs/CONTRIBUTING.md", ".github/CONTRIBUTING.md"]
  weight      = 1.0
  on_match    = "pass"
  on_no_match = "gap"
  rationale   = "A documented change procedure exists."

  [[controls.checks]]
  id          = "code-owners-defined"
  kind        = "file-exists"
  paths       = ["CODEOWNERS", ".github/CODEOWNERS", "docs/CODEOWNERS"]
  weight      = 2.0
  on_match    = "pass"
  on_no_match = "unknown"
  rationale   = "Named reviewers per area. Often configured server-side instead."

  [[controls.checks]]
  id          = "pr-review-required"
  kind        = "json-path"
  path        = ".github/settings.yml"
  key_path    = "branches.0.protection.required_pull_request_reviews.required_approving_review_count"
  assert      = { kind = "gte", value = 1 }
  weight      = 4.0
  on_match    = "pass"
  on_no_match = "gap"
  # The important one. Branch protection normally lives in the provider's API,
  # not in the repository, so the absence of this file is NOT evidence that
  # review is unenforced.
  on_no_files = "unknown"
  rationale   = """
Branch protection requiring review before merge. Usually configured server-side
and invisible to source inspection; the auditor must obtain an API export or
screenshot from the VCS provider.
"""

# ─────────────────────────────────────────────────────────────────────────────
# CC7.1 — Vulnerability management (partially observable)
# ─────────────────────────────────────────────────────────────────────────────
[[controls]]
id        = "CC7.1"
title     = "Vulnerability detection in dependencies"
clause    = "TSC CC7.1"
severity  = "high"
aggregate = "any"
intent    = """
The entity uses detection and monitoring procedures to identify changes to
configurations that introduce new vulnerabilities, and susceptibilities to
newly discovered vulnerabilities.
"""
remediation = "Add a dependency audit step (cargo audit, pip-audit, npm audit, Dependabot) to CI."

  [[controls.checks]]
  id          = "dependency-audit-in-ci"
  kind        = "regex-match-in-glob"
  glob        = "{.github/workflows/*.{yml,yaml},.woodpecker/*.{yml,yaml},.gitlab-ci.yml}"
  pattern     = "(?i)(cargo[- ]audit|cargo[- ]deny|pip-audit|npm audit|safety check|snyk|trivy|grype|dependency-check)"
  on_match    = "pass"
  on_no_match = "unknown"
  on_no_files = "unknown"
  rationale   = "An automated dependency vulnerability scan runs in the pipeline."

  [[controls.checks]]
  id          = "automated-dependency-updates"
  kind        = "file-exists"
  paths       = [".github/dependabot.yml", ".github/dependabot.yaml", "renovate.json", ".renovaterc.json", "deny.toml"]
  on_match    = "pass"
  on_no_match = "unknown"
  rationale   = "Automated dependency update or denial policy is configured."

# ─────────────────────────────────────────────────────────────────────────────
# Organizational controls.
#
# These are declared, not omitted. Each is Unknown by construction: the check
# looks for a policy document, and finding one is weak evidence that the control
# is DOCUMENTED — never that it is OPERATING. An auditor must test operating
# effectiveness by other means, which is exactly what the worklist says.
# ─────────────────────────────────────────────────────────────────────────────
[[controls]]
id        = "CC1.1"
title     = "Control environment — commitment to integrity and ethical values"
clause    = "TSC CC1.1"
severity  = "medium"
aggregate = "all"
intent    = """
The entity demonstrates a commitment to integrity and ethical values. This is an
organizational control: board oversight, tone at the top, and a code of conduct
whose operation is tested through interview and observation, not code review.
"""
remediation = "Provide the code of conduct, its acknowledgement records, and evidence of board oversight."

  [[controls.checks]]
  id          = "code-of-conduct-published"
  kind        = "file-exists"
  paths       = ["CODE_OF_CONDUCT.md", "docs/CODE_OF_CONDUCT.md", ".github/CODE_OF_CONDUCT.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
A published code of conduct is weak evidence that this control is documented,
and no evidence at all that it operates. Reported Unknown either way.
"""

[[controls]]
id        = "CC2.3"
title     = "Communication with external parties"
clause    = "TSC CC2.3"
severity  = "medium"
aggregate = "all"
intent    = """
The entity communicates with external parties regarding matters affecting the
functioning of internal control, including a channel for reporting security
issues.
"""
remediation = "Provide the vulnerability disclosure policy and evidence of its use."

  [[controls.checks]]
  id          = "security-disclosure-policy"
  kind        = "file-exists"
  paths       = ["SECURITY.md", "docs/SECURITY.md", ".github/SECURITY.md"]
  on_match    = "unknown"
  on_no_match = "gap"
  rationale   = """
A documented security contact. Its presence does not evidence that reports are
triaged, so a hit is Unknown; its total absence is a genuine communication gap.
"""

[[controls]]
id        = "CC9.2"
title     = "Vendor and business partner risk management"
clause    = "TSC CC9.2"
severity  = "medium"
aggregate = "all"
intent    = """
The entity assesses and manages risks associated with vendors and business
partners. Contracts, due-diligence records and subservice-organization reports
are the evidence, none of which is source-controlled.
"""
remediation = "Provide the vendor register, risk assessments, and subservice SOC 2 reports."

  [[controls.checks]]
  id          = "third-party-inventory-present"
  kind        = "file-exists"
  paths       = ["docs/vendors.md", "VENDORS.md", "docs/third-party.md", "sbom.json", "sbom.xml"]
  on_match    = "unknown"
  on_no_match = "unknown"
  # There is no source-visible answer here in either direction, and saying so
  # is more useful than inventing one.
  rationale   = """
Vendor management is contractual and lives outside version control. Reported
Unknown unconditionally; the auditor must obtain the vendor register directly.
"""
