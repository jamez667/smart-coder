# EU regulatory cluster: NIS2, DORA and the AI Act — thin evidence pack.
#
# Globs and paths address the AUDITED WORKSPACE. See docs/specs/13 and 14.
#
# THREE REGULATIONS IN ONE PACK, deliberately. Each has only a handful of
# source-visible obligations, and shipping three near-empty packs would imply
# more coverage than exists. Combining them makes the thinness visible.
#
# All three are governance regimes with management accountability at their core:
# NIS2 makes management bodies personally liable for cybersecurity risk
# measures; DORA governs ICT risk in financial entities and their critical
# third-party providers; the AI Act classifies systems by risk and imposes
# conformity assessment on high-risk ones. None of that lives in a repository.
#
# What DOES surface: the software-development hygiene each regime assumes, and —
# for the AI Act — whether AI components are even present, which is the first
# question a scoping conversation asks.

[framework]
id        = "eu-nis2-dora-aiact"
name      = "EU regulatory cluster: NIS2, DORA, AI Act"
version   = "1.0.0"
authority = "European Union"
scope_note = """
DELIBERATELY THIN, and covering three regulations at once because each has only
a handful of source-visible obligations.

NIS2 (Directive (EU) 2022/2555): cybersecurity risk-management measures with
management-body accountability, and incident reporting within 24/72 hours.
Almost entirely governance and process.

DORA (Regulation (EU) 2022/2554): ICT risk management for financial entities,
incident classification and reporting, digital operational resilience testing
(including threat-led penetration testing), and oversight of critical ICT
third-party providers via contractual registers. Entirely institutional.

EU AI Act (Regulation (EU) 2024/1689): risk classification, conformity
assessment, technical documentation, data governance, human oversight and
transparency for high-risk systems. Determined by INTENDED PURPOSE, which no
scanner can infer from code.

This pack evidences the engineering hygiene these regimes assume and flags
whether AI components are present at all. It does not assess applicability,
which is the threshold question for all three and requires legal analysis.
"""

# ═════════════════════════════════════════════════════════════════════════════
# NIS2 — Art. 21 cybersecurity risk-management measures
# ═════════════════════════════════════════════════════════════════════════════

[[controls]]
id        = "NIS2-21-2e"
title     = "Security in network and information systems acquisition, development and maintenance"
clause    = "NIS2 Art. 21(2)(e)"
severity  = "high"
aggregate = "weighted"
pass_at   = 0.6
gap_below = 0.3
intent    = """
Security in network and information systems acquisition, development and
maintenance, including vulnerability handling and disclosure.
"""
remediation = "Add vulnerability scanning to CI and publish a coordinated disclosure policy."

  [[controls.checks]]
  id          = "vulnerability-handling-in-ci"
  kind        = "regex-match-in-glob"
  glob        = "{.github/workflows/*.{yml,yaml},.woodpecker/*.{yml,yaml},.gitlab-ci.yml}"
  pattern     = "(?i)(cargo[- ]audit|cargo[- ]deny|pip-audit|npm audit|osv-scanner|grype|trivy|snyk|dependency-check)"
  weight      = 3.0
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "unknown"
  rationale   = "Automated vulnerability handling in development, which Art. 21(2)(e) names directly."

  [[controls.checks]]
  id          = "disclosure-policy-published"
  kind        = "file-exists"
  paths       = ["SECURITY.md", ".github/SECURITY.md", "docs/SECURITY.md", ".well-known/security.txt"]
  weight      = 2.0
  on_match    = "pass"
  on_no_match = "gap"
  rationale   = "A coordinated vulnerability disclosure channel. Triage effectiveness is not source-visible."

[[controls]]
id        = "NIS2-21-2h"
title     = "Policies and procedures regarding the use of cryptography"
clause    = "NIS2 Art. 21(2)(h)"
severity  = "critical"
aggregate = "all"
intent    = """
Policies and procedures regarding the use of cryptography and, where
appropriate, encryption.
"""
remediation = "Replace deprecated primitives and enforce TLS on external endpoints."

  [[controls.checks]]
  id          = "no-broken-cryptography"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb,php}"
  pattern     = "(?i)(hashlib\\.(md5|sha1)\\s*\\(|MD5\\.Create\\s*\\(|md5\\.New\\s*\\(|DES\\.new\\s*\\(|Cipher\\.getInstance\\s*\\(\\s*\"(DES|RC4))"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Deprecated primitives in use contradict any cryptography policy."

  [[controls.checks]]
  id          = "no-tls-verification-disabled"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb}"
  pattern     = "(?i)(verify\\s*=\\s*False|danger_accept_invalid_certs\\s*\\(\\s*true|rejectUnauthorized\\s*:\\s*false|InsecureSkipVerify\\s*:\\s*true)"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Disabled certificate verification defeats the encryption the policy requires."

[[controls]]
id        = "NIS2-20"
title     = "Governance — management body accountability"
clause    = "NIS2 Art. 20"
severity  = "critical"
aggregate = "all"
intent    = """
Management bodies must approve the cybersecurity risk-management measures,
oversee their implementation, and can be held liable for infringements.
Management body members must follow specific training.
"""
remediation = "Provide management approval records, oversight minutes and training attendance."

  [[controls.checks]]
  id          = "governance-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/governance.md", "docs/security-policy.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
Management-body approval, oversight and training are the distinguishing feature
of NIS2 and are evidenced by board minutes and attendance records. Reported
Unknown unconditionally.
"""

[[controls]]
id        = "NIS2-23"
title     = "Incident reporting obligations"
clause    = "NIS2 Art. 23"
severity  = "critical"
aggregate = "all"
intent    = """
Early warning to the CSIRT within 24 hours of becoming aware of a significant
incident, an incident notification within 72 hours, and a final report within
one month.
"""
remediation = "Provide the incident reporting procedure and the register of notifications made."

  [[controls.checks]]
  id          = "incident-reporting-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/incident-response.md", "SECURITY.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
Statutory reporting deadlines are met by a process, evidenced by the register of
notifications actually made to the CSIRT. Reported Unknown unconditionally.
"""

# ═════════════════════════════════════════════════════════════════════════════
# DORA — ICT risk management for financial entities
# ═════════════════════════════════════════════════════════════════════════════

[[controls]]
id        = "DORA-9"
title     = "Protection and prevention — ICT security"
clause    = "DORA Art. 9"
severity  = "high"
aggregate = "all"
intent    = """
Financial entities shall continuously monitor and control the security of ICT
systems and tools, minimise the impact of ICT risk through appropriate security
tools, policies and procedures, and ensure data confidentiality, integrity and
availability including during transit.
"""
remediation = "Enforce transport encryption and remove hardcoded credentials."

  [[controls.checks]]
  id          = "no-hardcoded-credentials"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb,php,yml,yaml,toml,json,tf,sh,ps1}"
  pattern     = "(?i)(aws_secret_access_key\\s*[:=]|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|xox[baprs]-[0-9A-Za-z-]{10,})"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Credentials in source are an ICT confidentiality failure."

  [[controls.checks]]
  id          = "no-plaintext-transport"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,yml,yaml,tf}"
  pattern     = "http://[a-zA-Z0-9][a-zA-Z0-9.-]*\\.(com|org|net|io|dev|co|ai|cloud|app)\\b"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Data in transit must be protected; plaintext HTTP to a public host is not."

[[controls]]
id        = "DORA-24"
title     = "Digital operational resilience testing"
clause    = "DORA Art. 24, 25, 26"
severity  = "high"
aggregate = "all"
intent    = """
Establish a sound and comprehensive digital operational resilience testing
programme, including vulnerability assessments, scenario-based tests, and — for
significant entities — threat-led penetration testing (TLPT) at least every
three years.
"""
remediation = "Provide the testing programme, results, and TLPT reports where applicable."

  [[controls.checks]]
  id          = "resilience-testing-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/pentest.md", "docs/resilience-testing.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
Threat-led penetration testing is conducted against live systems by accredited
testers under regulator-recognised frameworks (TIBER-EU). Automated CI scanning
is not a substitute and must not be presented as one. Reported Unknown.
"""

[[controls]]
id        = "DORA-28"
title     = "Management of ICT third-party risk"
clause    = "DORA Art. 28, 30"
severity  = "critical"
aggregate = "all"
intent    = """
Maintain a register of information on all contractual arrangements with ICT
third-party service providers, ensure contracts contain mandatory provisions,
and manage concentration risk — with critical providers subject to direct EU
oversight.
"""
remediation = "Provide the register of information and the ICT third-party contracts."

  [[controls.checks]]
  id          = "third-party-register-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/vendors.md", "docs/third-party.md", "sbom.json"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
An SBOM inventories software components; DORA's register of information covers
CONTRACTUAL arrangements with ICT service providers and their mandatory terms.
These are different artifacts. Reported Unknown unconditionally.
"""

# ═════════════════════════════════════════════════════════════════════════════
# EU AI Act — applicability first, obligations second
# ═════════════════════════════════════════════════════════════════════════════

[[controls]]
id        = "AIACT-SCOPE"
title     = "Applicability — are AI components present at all?"
clause    = "AI Act Art. 3, 6 (classification)"
severity  = "high"
aggregate = "all"
intent    = """
The AI Act applies to AI systems as defined in Art. 3 and classifies them by
risk under Art. 6. High-risk classification depends on the system's INTENDED
PURPOSE and its deployment context, not on its implementation.
"""
remediation = """
Determine applicability with legal advice. If AI components are present,
establish the intended purpose and classify accordingly before assessing
technical obligations.
"""

  [[controls.checks]]
  id          = "ai-components-detected"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{py,rs,ts,js,go,java,cs,toml,txt,json,yml,yaml}"
  # A scoping SIGNAL, not a finding: this tells a reader whether the AI Act is
  # even a conversation worth having, which is genuinely useful and honestly
  # limited.
  pattern     = "(?i)(torch|tensorflow|scikit-learn|sklearn|transformers|langchain|llama[-_]?index|openai|anthropic|huggingface|onnxruntime|xgboost|lightgbm)"
  on_match    = "unknown"
  on_no_match = "unknown"
  on_no_files = "unknown"
  rationale   = """
Detecting an ML dependency indicates AI components MAY be present — a useful
scoping signal. It cannot establish whether the system meets the Art. 3
definition, nor its intended purpose, which is what determines classification.
Reported Unknown either way; the presence or absence of a hit is the value here.
"""

[[controls]]
id        = "AIACT-12"
title     = "Record-keeping and logging for high-risk AI systems"
clause    = "AI Act Art. 12"
severity  = "high"
aggregate = "all"
intent    = """
High-risk AI systems shall technically allow for the automatic recording of
events (logs) over their lifetime, to a degree appropriate to the intended
purpose, ensuring traceability of functioning.
"""
remediation = "Implement lifecycle logging appropriate to the system's intended purpose."

  [[controls.checks]]
  id          = "logging-capability-present"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{rs,py,cs,ts,js,go,java}"
  pattern     = "\\b(tracing::|log::(info|warn|error)|logging\\.getLogger|ILogger<|winston|zap\\.|slog\\.)"
  on_match    = "unknown"
  on_no_match = "unknown"
  on_no_files = "unknown"
  rationale   = """
Logging calls exist, but Art. 12 requires records appropriate to the intended
purpose and sufficient for traceability — a design judgment against a
classification this tool has not made. Reported Unknown unconditionally.
"""

[[controls]]
id        = "AIACT-9-11-14"
title     = "Risk management, technical documentation and human oversight"
clause    = "AI Act Art. 9, 11, 14, 17"
severity  = "critical"
aggregate = "all"
intent    = """
High-risk AI systems require a risk management system across the lifecycle,
technical documentation per Annex IV, human oversight measures, and a quality
management system — assessed through conformity assessment before market placement.
"""
remediation = """
Provide the Annex IV technical documentation, risk management records, human
oversight design and the conformity assessment.
"""

  [[controls.checks]]
  id          = "aiact-obligations-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/ai-risk-management.md", "docs/model-card.md", "MODEL_CARD.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
Annex IV technical documentation, the risk management system, human oversight
design and conformity assessment are documentary and procedural. A model card is
a useful artifact but not an Annex IV file. Reported Unknown unconditionally.
"""
