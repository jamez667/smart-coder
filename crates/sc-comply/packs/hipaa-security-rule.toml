# HIPAA Security Rule (45 CFR Part 164 Subpart C) — thin evidence pack.
#
# Globs and paths address the AUDITED WORKSPACE. See docs/specs/13 and 14.
#
# DELIBERATELY THIN. The Security Rule is organised into administrative,
# physical and technical safeguards. The administrative safeguards (risk
# analysis, workforce security, training, contingency planning, BAAs) and the
# physical safeguards (facility access, workstation security, device disposal)
# yield nothing from a repository. Only the technical safeguards touch code, and
# even they turn on a question this tool cannot answer: WHERE IS THE ePHI?
#
# A repository with no ePHI in scope is not "compliant" — it is out of scope,
# which is a different statement. This pack evidences engineering hygiene that
# SUPPORTS the technical safeguards; it does not assess HIPAA compliance.

[framework]
id        = "hipaa-security-rule"
name      = "HIPAA Security Rule (45 CFR 164 Subpart C)"
version   = "1.0.0"
authority = "US Department of Health and Human Services"
scope_note = """
DELIBERATELY NARROW. This pack covers only the technical safeguards of the
HIPAA Security Rule as they surface in source code, and even then indirectly.

Not covered, because no repository can evidence them: the entire administrative
safeguard set (§164.308 — risk analysis, sanction policy, workforce clearance,
security awareness training, incident procedures, contingency plan, evaluation),
the entire physical safeguard set (§164.310 — facility access, workstation use,
device and media controls), Business Associate Agreements (§164.314), and
policy documentation and retention (§164.316).

The prior question this tool cannot answer: **is ePHI in scope for this
repository at all?** Encryption is an addressable — not required —
implementation specification, meaning a covered entity may document why an
alternative is reasonable. A clean result here is engineering hygiene, never a
compliance determination.

Consult counsel and a qualified assessor. This pack is a starting point for a
technical conversation, not an assessment.
"""

# ═════════════════════════════════════════════════════════════════════════════
# §164.312 Technical safeguards — the only part a repository touches.
# ═════════════════════════════════════════════════════════════════════════════

[[controls]]
id        = "164.312(e)(1)"
title     = "Transmission security"
clause    = "45 CFR 164.312(e)(1), (e)(2)(ii)"
severity  = "critical"
aggregate = "all"
intent    = """
Implement technical security measures to guard against unauthorized access to
electronic protected health information being transmitted over an electronic
communications network. Encryption is an addressable implementation
specification.
"""
remediation = """
Enforce TLS on every endpoint that may carry ePHI and remove any code path that
disables certificate verification. If encryption is not implemented, document
the addressable-specification rationale.
"""

  [[controls.checks]]
  id          = "no-tls-verification-disabled"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb}"
  pattern     = "(?i)(verify\\s*=\\s*False|danger_accept_invalid_certs\\s*\\(\\s*true|rejectUnauthorized\\s*:\\s*false|InsecureSkipVerify\\s*:\\s*true|CURLOPT_SSL_VERIFYPEER\\s*,\\s*(0|false))"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = """
Disabling certificate verification defeats transmission security regardless of
the addressable/required distinction — there is no rationale under which it is
reasonable.
"""

  [[controls.checks]]
  id          = "no-plaintext-transport"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,yml,yaml,tf}"
  pattern     = "http://[a-zA-Z0-9][a-zA-Z0-9.-]*\\.(com|org|net|io|dev|co|ai|cloud|app)\\b"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Plaintext transport to a public host. Whether ePHI traverses it is not determinable here."

[[controls]]
id        = "164.312(a)(2)(iv)"
title     = "Encryption and decryption of ePHI at rest"
clause    = "45 CFR 164.312(a)(2)(iv)"
severity  = "critical"
aggregate = "all"
intent    = """
Implement a mechanism to encrypt and decrypt electronic protected health
information. This is an addressable implementation specification: a covered
entity may document why an alternative measure is reasonable and appropriate.
"""
remediation = """
Enable storage encryption for any datastore holding ePHI, or document the
addressable rationale. Replace deprecated cryptographic primitives.
"""

  [[controls.checks]]
  id          = "no-broken-cryptography"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb,php}"
  pattern     = "(?i)(hashlib\\.(md5|sha1)\\s*\\(|MD5\\.Create\\s*\\(|md5\\.New\\s*\\(|DES\\.new\\s*\\(|Cipher\\.getInstance\\s*\\(\\s*\"(DES|RC4))"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Deprecated primitives cannot constitute the required encryption mechanism."

  [[controls.checks]]
  id          = "encryption-at-rest-declared"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{tf,yml,yaml,json}"
  pattern     = "(?i)(encrypted\\s*[:=]\\s*true|storage_encrypted|server_side_encryption|kms_key_id|encryption_at_rest)"
  on_match    = "unknown"
  on_no_match = "unknown"
  on_no_files = "unknown"
  # Unconditional: finding encryption config says nothing about whether the
  # encrypted store is the one holding ePHI.
  rationale   = """
Storage encryption may be declared in infrastructure code, but this tool cannot
determine whether the encrypted store holds ePHI — which is the whole question.
Reported Unknown unconditionally; the assessor must map ePHI to datastores.
"""

[[controls]]
id        = "164.312(b)"
title     = "Audit controls"
clause    = "45 CFR 164.312(b)"
severity  = "high"
aggregate = "all"
intent    = """
Implement hardware, software, and/or procedural mechanisms that record and
examine activity in information systems that contain or use electronic protected
health information.
"""
remediation = "Adopt structured logging with user and record identifiers; ship logs to protected retention."

  [[controls.checks]]
  id          = "application-logging-present"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{rs,py,cs,ts,js,go,java}"
  pattern     = "\\b(tracing::|log::(info|warn|error)|logging\\.getLogger|ILogger<|winston|zap\\.|slog\\.|logrus)"
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "unknown"
  rationale   = """
The application records activity. Whether those records capture ePHI ACCESS
specifically — which is what §164.312(b) requires — is not determinable from the
presence of a logging call.
"""

[[controls]]
id        = "164.312(a)(1)"
title     = "Access control — unique user identification"
clause    = "45 CFR 164.312(a)(1), (a)(2)(i)"
severity  = "critical"
aggregate = "all"
intent    = """
Implement technical policies and procedures that allow access only to those
persons or software programs granted access rights, including assigning a unique
name or number for identifying and tracking user identity.
"""
remediation = """
Move credentials to a managed secret store; shared or hardcoded credentials
defeat unique user identification entirely.
"""

  [[controls.checks]]
  id          = "no-hardcoded-credentials"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb,php,yml,yaml,toml,json,tf,sh,ps1}"
  pattern     = "(?i)(aws_secret_access_key\\s*[:=]|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|xox[baprs]-[0-9A-Za-z-]{10,})"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "A shared hardcoded credential makes unique user identification impossible."

  [[controls.checks]]
  id          = "no-committed-private-keys"
  kind        = "regex-must-not-match"
  glob        = "**/*"
  pattern     = "-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*", "**/*.snap"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Access control begins with keys not being readable by everyone with repository access."

# ═════════════════════════════════════════════════════════════════════════════
# Administrative, physical and organizational safeguards — declared.
# ═════════════════════════════════════════════════════════════════════════════

[[controls]]
id        = "164.308"
title     = "Administrative safeguards"
clause    = "45 CFR 164.308"
severity  = "critical"
aggregate = "all"
intent    = """
Security management process (including the required risk analysis and risk
management), assigned security responsibility, workforce security, information
access management, security awareness and training, security incident
procedures, contingency plan, and periodic evaluation.
"""
remediation = """
Provide the risk analysis, workforce clearance records, training completion,
incident procedures and contingency plan. The risk analysis is the foundational
required specification — begin there.
"""

  [[controls.checks]]
  id          = "administrative-safeguards-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/risk-analysis.md", "docs/security-policy.md", "SECURITY.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
The administrative safeguards are the largest part of the Security Rule and none
of them are source-controlled. The §164.308(a)(1)(ii)(A) risk analysis in
particular is a required specification with no technical proxy. Reported Unknown
unconditionally.
"""

[[controls]]
id        = "164.310"
title     = "Physical safeguards"
clause    = "45 CFR 164.310"
severity  = "high"
aggregate = "all"
intent    = """
Facility access controls, workstation use and security, and device and media
controls including disposal and media re-use.
"""
remediation = "Provide facility documentation, or the cloud provider's audited attestation where hosting is delegated."

  [[controls.checks]]
  id          = "physical-safeguards-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/physical-security.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
Physical safeguards are not observable from a repository. For cloud-hosted
systems these largely inherit from the provider under the BAA. Reported Unknown
unconditionally.
"""

[[controls]]
id        = "164.314"
title     = "Organizational requirements — business associate contracts"
clause    = "45 CFR 164.314(a)"
severity  = "critical"
aggregate = "all"
intent    = """
A covered entity must obtain satisfactory assurances, documented through a
written business associate agreement, that each business associate will
appropriately safeguard the ePHI it creates, receives, maintains or transmits.
"""
remediation = "Provide executed BAAs for every business associate, including cloud and SaaS providers."

  [[controls.checks]]
  id          = "baa-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/vendors.md", "docs/business-associates.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
Business Associate Agreements are executed contracts. A dependency lockfile
inventories software, not business associates. Reported Unknown unconditionally;
note that cloud and SaaS providers touching ePHI each require a BAA.
"""
