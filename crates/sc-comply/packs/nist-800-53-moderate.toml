# NIST SP 800-53 Rev. 5 — moderate baseline, thin evidence pack.
#
# Globs and paths address the AUDITED WORKSPACE. See docs/specs/13 and 14.
#
# DELIBERATELY THIN. 800-53 Rev. 5 defines over 1,000 controls across 20
# families; the FIPS 199 moderate baseline selects roughly 300 of them. Of those,
# perhaps twenty have any source-visible component — the rest govern system
# operation, personnel, physical facilities, contingency planning and
# organizational programme management.
#
# This pack covers the SA (System and Services Acquisition), SI (System and
# Information Integrity), CM (Configuration Management) and SC (System and
# Communications Protection) families where they touch code, and names the
# families it does not cover so the omission is deliberate rather than implied.

[framework]
id        = "nist-800-53r5-moderate"
name      = "NIST SP 800-53 Rev. 5 (moderate baseline, source-visible subset)"
version   = "1.0.0"
authority = "NIST"
scope_note = """
DELIBERATELY NARROW. The moderate baseline selects roughly 300 controls. This
pack addresses about a dozen — those with a genuine source-code component.

Covered in part: SA-11 (developer testing), SA-15 (development process), SA-22
(unsupported components), SI-2 (flaw remediation), SI-10 (input validation),
CM-2/CM-3 (baseline and change control), SC-8 (transmission confidentiality),
SC-13 (cryptographic protection), SC-28 (protection at rest), IA-5 (authenticator
management), AU-2 (event logging).

NOT covered — entire families with no source surface: AT (awareness and
training), CP (contingency planning), IR (incident response), MA (maintenance),
MP (media protection), PE (physical and environmental), PS (personnel security),
PM (programme management), RA (risk assessment, beyond dependency scanning), and
most of AC (access control) and CA (assessment and authorization).

An ATO requires a System Security Plan, an assessment by an independent
assessor, and an authorizing official's risk acceptance. This pack contributes
evidence to a handful of control implementations; it is not an assessment.
"""

[[controls]]
id        = "SA-11"
title     = "Developer testing and evaluation"
clause    = "NIST SP 800-53 Rev. 5 SA-11"
severity  = "high"
aggregate = "weighted"
pass_at   = 0.6
gap_below = 0.3
intent    = """
Require the developer of the system, component or service to create and
implement a security assessment plan, perform testing and evaluation at the
depth and coverage specified, and correct flaws identified during testing.
"""
remediation = "Run the test suite and static analysis in CI on every change."

  [[controls.checks]]
  id          = "automated-testing-in-ci"
  kind        = "regex-match-in-glob"
  glob        = "{.github/workflows/*.{yml,yaml},.woodpecker/*.{yml,yaml},.gitlab-ci.yml,azure-pipelines.yml}"
  pattern     = "(?i)(cargo test|pytest|dotnet test|npm (run )?test|go test|mvn test|check\\.(sh|ps1))"
  weight      = 3.0
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "gap"
  rationale   = "Developer testing performed automatically on every change."

  [[controls.checks]]
  id          = "static-analysis-in-ci"
  kind        = "regex-match-in-glob"
  glob        = "{.github/workflows/*.{yml,yaml},.woodpecker/*.{yml,yaml},.gitlab-ci.yml}"
  pattern     = "(?i)(codeql|semgrep|sonarqube|bandit|gosec|clippy|eslint|checkmarx|fortify|coverity)"
  weight      = 2.0
  on_match    = "pass"
  on_no_match = "unknown"
  on_no_files = "unknown"
  rationale   = "SA-11(1) calls for static code analysis specifically."

[[controls]]
id        = "SI-2"
title     = "Flaw remediation"
clause    = "NIST SP 800-53 Rev. 5 SI-2"
severity  = "high"
aggregate = "weighted"
pass_at   = 0.6
gap_below = 0.3
intent    = """
Identify, report and correct system flaws; test software and firmware updates
for effectiveness and potential side effects before installation; and install
security-relevant updates within an organization-defined time period.
"""
remediation = "Add dependency vulnerability scanning and an automated update policy."

  [[controls.checks]]
  id          = "vulnerability-scanning"
  kind        = "regex-match-in-glob"
  glob        = "{.github/workflows/*.{yml,yaml},.woodpecker/*.{yml,yaml},.gitlab-ci.yml}"
  pattern     = "(?i)(cargo[- ]audit|cargo[- ]deny|pip-audit|npm audit|osv-scanner|grype|trivy|snyk|dependency-check)"
  weight      = 3.0
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "unknown"
  rationale   = "Automated identification of flaws in components."

  [[controls.checks]]
  id          = "automated-remediation-policy"
  kind        = "file-exists"
  paths       = [".github/dependabot.yml", ".github/dependabot.yaml", "renovate.json", ".renovaterc.json", "deny.toml"]
  weight      = 2.0
  on_match    = "pass"
  on_no_match = "unknown"
  rationale   = "SI-2(5) automatic update capability, or an equivalent policy."

[[controls]]
id        = "SA-22"
title     = "Unsupported system components"
clause    = "NIST SP 800-53 Rev. 5 SA-22"
severity  = "high"
aggregate = "all"
intent    = """
Replace system components when support for the components is no longer
available from the developer, vendor or manufacturer; or provide justification
and documented approval for continued use.
"""
remediation = "Pin the toolchain to a supported version and keep dependencies inventoried."

  [[controls.checks]]
  id          = "component-inventory"
  kind        = "file-exists"
  paths       = ["Cargo.lock", "package-lock.json", "yarn.lock", "pnpm-lock.yaml", "poetry.lock", "go.sum", "Gemfile.lock", "composer.lock"]
  on_match    = "unknown"
  on_no_match = "gap"
  # Asymmetric deliberately. Having NO inventory is a real, source-visible gap:
  # you cannot identify unsupported components without knowing what you use.
  # But HAVING one proves only that — whether any listed component is still
  # supported by its vendor is a fact about the vendor, not the lockfile.
  rationale   = """
An inventory is the precondition for this control, not satisfaction of it:
SA-22 turns on whether each component is still SUPPORTED BY ITS VENDOR, which no
lockfile records. A hit is Unknown; total absence is a genuine gap.
"""

  [[controls.checks]]
  id          = "toolchain-pinned"
  kind        = "file-exists"
  paths       = ["rust-toolchain.toml", "rust-toolchain", ".nvmrc", ".python-version", ".tool-versions", "go.mod"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
A pinned version is visible; whether that version is still vendor-supported is
not. Reported Unknown either way — the auditor must check support lifecycles
against the inventory.
"""

[[controls]]
id        = "SC-8"
title     = "Transmission confidentiality and integrity"
clause    = "NIST SP 800-53 Rev. 5 SC-8, SC-8(1)"
severity  = "critical"
aggregate = "all"
intent    = """
Protect the confidentiality and integrity of transmitted information, using
cryptographic mechanisms to prevent unauthorized disclosure and detect changes
during transmission.
"""
remediation = "Enforce TLS on all external endpoints and never disable certificate verification."

  [[controls.checks]]
  id          = "no-tls-verification-disabled"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb}"
  pattern     = "(?i)(verify\\s*=\\s*False|danger_accept_invalid_certs\\s*\\(\\s*true|rejectUnauthorized\\s*:\\s*false|InsecureSkipVerify\\s*:\\s*true|CURLOPT_SSL_VERIFYPEER\\s*,\\s*(0|false))"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Disabling verification defeats both confidentiality and integrity of transmission."

  [[controls.checks]]
  id          = "no-plaintext-transport"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,yml,yaml,tf}"
  pattern     = "http://[a-zA-Z0-9][a-zA-Z0-9.-]*\\.(com|org|net|io|dev|co|ai|cloud|app)\\b"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Plaintext transport to a public host."

[[controls]]
id        = "SC-13"
title     = "Cryptographic protection"
clause    = "NIST SP 800-53 Rev. 5 SC-13"
severity  = "critical"
aggregate = "all"
intent    = """
Determine the cryptographic uses required and implement the types of
cryptography required for each use, using FIPS-validated or NSA-approved
cryptography where applicable.
"""
remediation = "Replace deprecated primitives; federal systems additionally require FIPS-validated modules."

  [[controls.checks]]
  id          = "no-broken-primitives"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb,php}"
  pattern     = "(?i)(hashlib\\.(md5|sha1)\\s*\\(|MD5\\.Create\\s*\\(|md5\\.New\\s*\\(|sha1\\.New\\s*\\(|DES\\.new\\s*\\(|Cipher\\.getInstance\\s*\\(\\s*\"(DES|RC4))"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = """
Deprecated primitives. Note SC-13 for federal systems also requires FIPS-VALIDATED
modules, which is a property of the crypto library build and not source-visible.
"""

[[controls]]
id        = "IA-5"
title     = "Authenticator management"
clause    = "NIST SP 800-53 Rev. 5 IA-5, IA-5(7)"
severity  = "critical"
aggregate = "all"
intent    = """
Manage system authenticators, and specifically ensure that unencrypted static
authenticators are not embedded in applications or other forms of static
storage.
"""
remediation = "Rotate any exposed credential and move secrets to a managed store."

  [[controls.checks]]
  id          = "no-embedded-authenticators"
  kind        = "regex-must-not-match"
  glob        = "**/*.{rs,py,cs,ts,js,go,java,rb,php,yml,yaml,toml,json,tf,sh,ps1}"
  pattern     = "(?i)(aws_secret_access_key\\s*[:=]|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|xox[baprs]-[0-9A-Za-z-]{10,})"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*"]
  # This control is about what was COMMITTED; a gitignored file is not.
  tracked_only = true
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "IA-5(7) prohibits unencrypted static authenticators embedded in applications, explicitly."

  [[controls.checks]]
  id          = "no-committed-private-keys"
  kind        = "regex-must-not-match"
  glob        = "**/*"
  pattern     = "-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*", "**/*.snap"]
  # This control is about what was COMMITTED; a gitignored file is not.
  tracked_only = true
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "A committed private key is an embedded static authenticator."

[[controls]]
id        = "CM-3"
title     = "Configuration change control"
clause    = "NIST SP 800-53 Rev. 5 CM-2, CM-3"
severity  = "high"
aggregate = "weighted"
pass_at   = 0.7
gap_below = 0.35
intent    = """
Develop and maintain a baseline configuration, and determine, document, approve
and test configuration-controlled changes before implementation.
"""
remediation = "Require review and automated testing before merge."

  [[controls.checks]]
  id          = "change-pipeline-defined"
  kind        = "file-exists"
  paths       = [".github/workflows", ".woodpecker", ".gitlab-ci.yml", "azure-pipelines.yml", "Jenkinsfile"]
  weight      = 2.0
  on_match    = "pass"
  on_no_match = "gap"
  rationale   = "An automated change pipeline."

  [[controls.checks]]
  id          = "change-testing"
  kind        = "regex-match-in-glob"
  glob        = "{.github/workflows/*.{yml,yaml},.woodpecker/*.{yml,yaml},.gitlab-ci.yml}"
  pattern     = "(?i)(cargo test|pytest|dotnet test|npm (run )?test|go test|check\\.(sh|ps1))"
  weight      = 3.0
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "gap"
  rationale   = "CM-3 requires changes to be tested before implementation."

  [[controls.checks]]
  id          = "change-approval"
  kind        = "json-path"
  path        = ".github/settings.yml"
  key_path    = "branches.0.protection.required_pull_request_reviews.required_approving_review_count"
  assert      = { kind = "gte", value = 1 }
  weight      = 3.0
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "unknown"
  rationale   = "Documented approval before implementation. Usually a provider setting."

[[controls]]
id        = "SI-10"
title     = "Information input validation"
clause    = "NIST SP 800-53 Rev. 5 SI-10"
severity  = "high"
aggregate = "all"
intent    = """
Check the validity of information inputs to the system, verifying that inputs
match specified definitions for format and content.
"""
remediation = "Parameterize queries and remove command injection sinks."

  [[controls.checks]]
  id          = "no-injection-sinks"
  kind        = "regex-must-not-match"
  glob        = "**/*.{py,js,ts,rb,php}"
  pattern     = "(?i)(subprocess\\.(run|call|Popen|check_output)\\([^)]*shell\\s*=\\s*True|os\\.system\\s*\\(|child_process\\.exec\\s*\\(|\\beval\\s*\\(\\s*(req|request|params|input|argv))"
  exclude_globs = ["crates/sc-comply/**/*", "crates/sc-comply-author/**/*", "**/tests/**/*"]
  on_match    = "gap"
  on_no_match = "pass"
  on_no_files = "unknown"
  rationale   = "Unvalidated input reaching a command or code interpreter."

[[controls]]
id        = "AU-2"
title     = "Event logging"
clause    = "NIST SP 800-53 Rev. 5 AU-2, AU-3"
severity  = "medium"
aggregate = "all"
intent    = """
Identify the event types the system is capable of logging, and ensure audit
records contain sufficient information to establish what occurred, when, where,
the source, and the outcome.
"""
remediation = "Adopt structured logging with correlation and identity fields."

  [[controls.checks]]
  id          = "application-logging-present"
  kind        = "regex-match-in-glob"
  glob        = "**/*.{rs,py,cs,ts,js,go,java}"
  pattern     = "\\b(tracing::|log::(info|warn|error)|logging\\.getLogger|ILogger<|winston|zap\\.|slog\\.|logrus)"
  on_match    = "pass"
  on_no_match = "gap"
  on_no_files = "unknown"
  rationale   = "The system emits audit records. Their sufficiency under AU-3 is not source-determinable."

# ═════════════════════════════════════════════════════════════════════════════
# Families with no source surface — declared, not omitted.
# ═════════════════════════════════════════════════════════════════════════════

[[controls]]
id        = "CA-2"
title     = "Control assessments and authorization"
clause    = "NIST SP 800-53 Rev. 5 CA-2, CA-6"
severity  = "critical"
aggregate = "all"
intent    = """
Assess the controls in the system and its environment of operation to determine
the extent to which they are implemented correctly, and obtain an authorization
to operate from a senior official.
"""
remediation = "Provide the System Security Plan, Security Assessment Report, and the ATO letter."

  [[controls.checks]]
  id          = "assessment-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/ssp.md", "docs/security-plan.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
An authorization to operate requires an independent assessor and an authorizing
official's risk acceptance. No scanner produces one. Reported Unknown
unconditionally.
"""

[[controls]]
id        = "PE-CP-PS-AT"
title     = "Physical, contingency, personnel and training families"
clause    = "NIST SP 800-53 Rev. 5 families PE, CP, PS, AT, IR, MA, MP"
severity  = "high"
aggregate = "all"
intent    = """
Physical and environmental protection, contingency planning, personnel security,
awareness and training, incident response, maintenance and media protection.
"""
remediation = "Provide facility documentation, contingency plans and test results, personnel screening and training records."

  [[controls.checks]]
  id          = "operational-families-out-of-scope"
  kind        = "file-exists"
  paths       = ["docs/contingency-plan.md", "docs/physical-security.md"]
  on_match    = "unknown"
  on_no_match = "unknown"
  rationale   = """
Seven complete control families with no source-code surface, grouped here so the
evidence pack does not imply they were examined. Each requires operational and
documentary evidence. Reported Unknown unconditionally.
"""
