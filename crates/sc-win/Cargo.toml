[package]
name = "sc-win"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Windows vibe-coding desktop app: type intent, watch the agent/swarm work over the proven core (spec 12 / M9)."

# The agent product. `smart-coder-crafter` is a separate crate (`sc-crafter`) rather than a
# second `[[bin]]` here, because a bin target in this crate would link this crate's whole
# dependency tree — including every model crate — and the Crafter's guarantee is that its
# tree contains none of them (spec 21).
[[bin]]
name = "smart-coder"
path = "src/main.rs"

[lib]
name = "sc_win"
path = "src/lib.rs"

[dependencies]
# THE EDITOR. Smart Coder is the Crafter plus an agent (spec 21), so the editor half is a
# dependency rather than a mode: buffers, layout, git, the file tree, the terminal, the
# profiler and compile diagnostics all live there and are shared verbatim with
# `smart-coder-crafter`. What this crate adds on top is everything that talks to a model.
sc-craft-ui = { path = "../sc-craft-ui" }
# The folded-stack parser and flame layout, shared with the agent tool. Zero deps.
sc-flame = { path = "../sc-flame" }
sc-comply = { path = "../sc-comply" }
sc-comply-author = { path = "../sc-comply-author" }
sc-core = { path = "../sc-core" }
sc-iterate = { path = "../sc-iterate" }
sc-swarm = { path = "../sc-swarm" }
sc-workflow = { path = "../sc-workflow" }
sc-model = { path = "../sc-model" }
sc-tools = { path = "../sc-tools" }
# Spec 23: the harness resolves a pasted stack trace before the model sees it.
sc-index = { path = "../sc-index" }
sc-verify = { path = "../sc-verify" }
sc-web = { path = "../sc-web" }
sc-proto = { path = "../sc-proto" }
iced = { version = "0.14", features = ["tokio", "canvas", "advanced", "image"] }
# The CODE pane's EDIT view (spec 21). A canvas-based editor that owns its own scroll state,
# which is what makes a scroll-synced line-number gutter possible at all: iced's built-in
# `text_editor` does not expose its scroll offset, and upstream declined to add it
# (iced-rs/iced#2970, closed unmerged: "not reasonable to implement externally"). Brings syntax
# highlighting, folding, undo and search with it.
# PINNED EXACTLY: pre-1.0 and single-maintainer, so a patch release must never arrive
# unreviewed. Bump deliberately, then re-run scripts/check.ps1.
iced-code-editor = "=0.3.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
serde_json = { workspace = true }
tokio = { version = "1.52.4", features = ["rt"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
