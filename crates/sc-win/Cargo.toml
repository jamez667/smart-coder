[package]
name = "sc-win"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Windows vibe-coding desktop app: type intent, watch the agent/swarm work over the proven core (spec 12 / M9)."

# TWO binaries over one editor.
#
# This comment used to explain why the Crafter had to be a separate crate: a bin target
# here would link this crate's whole dependency tree, "including every model crate".
# That was true, and it stopped being true when the agent became a plugin (spec 25).
# This crate's tree is now sc-craft-ui, sc-editor, sc-flame, sc-fsutil, sc-index and
# sc-plugin-proto — six crates, none of which can reach a model, which `scripts/check.*`
# asserts against both this crate and the crafter binary.
#
# So the difference between the two is no longer what they link. It is one call to
# `set_product` at the top of main: which state directory, which default layout, which
# plugin directory, which name in the title bar.
[[bin]]
name = "smart-coder"
path = "src/main.rs"

# The editor, and only the editor (spec 21). Same app, different product identity.
[[bin]]
name = "smart-coder-crafter"
path = "src/crafter.rs"

[lib]
name = "sc_win"
path = "src/lib.rs"

[dependencies]
# THE EDITOR. Smart Coder is the Crafter plus an agent (spec 21), so the editor half is a
# dependency rather than a mode: buffers, layout, git, the file tree, the terminal, the
# profiler and compile diagnostics all live there and are shared verbatim with
# `smart-coder-crafter`. What this crate adds on top is everything that talks to a model.
sc-craft-ui = { path = "../sc-craft-ui" }
# The plugin wire protocol (spec 25). Named directly rather than reached through
# sc-craft-ui, because this crate builds HostMessages of its own.
sc-plugin-proto = { path = "../sc-plugin-proto" }
# The workspace containment rule, shared with the agent's tools (spec 25).
sc-fsutil = { path = "../sc-fsutil" }
# The folded-stack parser and flame layout, shared with the agent tool. Zero deps.
sc-flame = { path = "../sc-flame" }
# Spec 23: the harness resolves a pasted stack trace before the model sees it.
sc-index = { path = "../sc-index" }
iced = { version = "0.14", features = ["tokio", "canvas", "advanced", "image"] }
# The CODE pane's EDIT view (spec 21), FORKED from iced-code-editor 0.3.11 — see
# crates/sc-editor/FORK.md for what diverged and why. A canvas-based editor that owns its
# own scroll state, which is what makes a scroll-synced line-number gutter possible at all:
# iced's built-in `text_editor` does not expose its scroll offset, and upstream declined to
# add it (iced-rs/iced#2970, closed unmerged). Brings syntax highlighting, folding, undo
# and search with it.
sc-editor = { path = "../sc-editor" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
serde_json = { workspace = true }
tokio = { version = "1.52.4", features = ["rt"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
