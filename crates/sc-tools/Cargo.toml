[package]
name = "sc-tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool Registry: strict tool schemas, validation, and built-in tools (spec 04)."

[dependencies]
sc-proto = { path = "../sc-proto" }
sc-index = { path = "../sc-index" }
# The crate graph behind `cargo_info`. Zero dependencies of its own, so this adds
# nothing to the build but a manifest reader.
sc-cargo = { path = "../sc-cargo" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
