[package]
name = "sc-eval"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The smart-coder eval harness: score a solver on red->green tasks."

[lib]
name = "sc_eval"
path = "src/lib.rs"

[[bin]]
name = "sc-eval"
path = "src/main.rs"

# The ladder A/B (spec 23). Its own binary rather than a sc-eval subcommand: it
# is an experiment with several arms and a caveat-carrying report, not a scoring
# run. Formerly `gateway-ab`, when the gateway was its only treatment arm.
[[bin]]
name = "ladder-ab"
path = "src/bin/ladder-ab.rs"

[dependencies]
sc-proto = { path = "../sc-proto" }
sc-model = { path = "../sc-model" }
sc-core = { path = "../sc-core" }
sc-tools = { path = "../sc-tools" }
# The retrieval eval (spec 23) scores sc-index's search with no model at all.
sc-index = { path = "../sc-index" }
sc-verify = { path = "../sc-verify" }
# The A/B arm under test. The eval depends on it; sc-core deliberately does not.
sc-gateway = { path = "../sc-gateway" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The live SWE-bench test fetches the gold patch (the answer) at run time rather
# than vendoring it beside the tasks. Same client the model backends use.
ureq = { version = "3", features = ["json"] }
