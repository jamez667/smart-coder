[package]
name = "sc-comply-author"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Authoring-time assistant for sc-comply framework packs: deterministic lints plus a model-backed drafting seam."

[lib]
name = "sc_comply_author"
path = "src/lib.rs"

[dependencies]
# The pack schema and its validator. This crate reads and critiques packs; it
# never runs an audit.
sc-comply = { path = "../sc-comply" }
sc-proto = { path = "../sc-proto" }
# The model seam lives HERE, never in sc-comply — keeping the audit path
# model-free is what makes an evidence pack reproducible.
sc-model = { path = "../sc-model" }
# For `extract_json_array`: the house tolerant-JSON scan.
sc-core = { path = "../sc-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
