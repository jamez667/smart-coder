# The gate: fmt, clippy, check, test — the same four scripts/check.sh runs.
#
# The workspace includes `sc-win`, an iced (winit/wgpu) GUI crate, so even a
# `cargo check` of the whole workspace on Linux needs the X11/Wayland/font dev
# libraries below. The rest of the stack is pure-Rust (ureq + rustls) — no
# OpenSSL/libssl required.
#
# The browser tests in `web/e2e/` are NOT run here, deliberately. They hold 28
# Playwright tests that take about six seconds; standing up something for them to
# drive takes twenty-seven minutes, because the harness builds the release image
# with no warm cache. Run them by hand before anything that matters:
#
#     cd web && npx playwright test

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-runnable by hand. Needed while `test sc-eval` is under investigation: the
  # step's watchdog output is only visible in the LIVE log, because a job killed
  # by `timeout-minutes` uploads nothing for the step that was running -- so
  # someone has to be watching, and that meant pushing a commit to get a run.
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same ref makes the first one's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Enforced by GitHub OUTSIDE the runner, which is the point: a `timeout`
    # wrapped around the command did not hold, because it signals `cargo` and
    # not the stuck test binary beneath it. 30 minutes is generous against a
    # suite that takes 168s locally and took 241s on the old self-hosted runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # System libraries the iced/winit/wgpu GUI crate links against on Linux.
      # (No Python: full agent/interpreter integration tests are #[ignore]d and
      # don't run in CI.)
      - name: system libraries for the GUI crate
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libfontconfig1-dev libfreetype6-dev

      # rust-toolchain.toml pins the channel and its components; rustup reads it
      # on the first cargo call, so local and CI run the identical compiler and
      # lint set. Bump the file, deliberately, to move both.
      - name: rustup components
        run: rustup component add rustfmt clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: Swatinem/rust-cache@v2

      # **The interface, built before any cargo command touches sc-server.**
      # `include_str!` reads the bundle at compile time, so `cargo check` fails
      # outright without it — this is not an optional extra step, it is a
      # prerequisite of compiling at all. Nothing generated is committed, which
      # is why this is here; the alternative was checking a 150 kB build artifact
      # into the tree, where a stale one ships silently.
      #
      # `npm ci`, not `npm install`: the lockfile decides. A dependency resolved
      # at build time is a dependency nobody chose, on the one component that
      # faces the network.
      - name: build the web interface
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      # The gates, in the same order as scripts/check.sh.
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: check
        run: cargo check --workspace

      # ONE STEP PER CRATE, deliberately, and not `cargo test --workspace`.
      #
      # The suite is not slow: 213s locally single-threaded, 241s on the old
      # self-hosted runner. On a hosted runner `--workspace` hangs and the job is
      # killed — three times now, twice at 3003s/3005s (two seconds apart across
      # independent runs, which is a watchdog, not starvation).
      #
      # **A job killed by `timeout-minutes` uploads NOTHING.** The log archive for
      # such a run contains only the jobs that finished: no step logs for the
      # killed one, and no step summary either. So every attempt to instrument
      # from inside the hanging step — streaming to the summary, sampling to a
      # file, `tee`, `stdbuf` — was unrecoverable by construction, and three runs
      # produced zero test names.
      #
      # Splitting by crate moves the evidence OUT of the doomed step: each crate
      # that passes is its own completed step with its own uploaded log, so the
      # first step that never completes names the crate. It also localises the
      # cost — one hanging crate no longer denies coverage to the other 31.
      #
      # Coverage is unchanged: this is every workspace member, including the four
      # that scripts/check.sh excludes for time (sc-eval, sc-trace,
      # sc-comply-author, sc-cli). They are slow, not flaky, and CI is where they
      # are meant to be covered.
      #
      # `--no-fail-fast` is NOT used: a crate that fails should stop its own step,
      # and the remaining steps still run because each is independent.
      - name: test sc-android
        run: cargo test -p sc-android
      - name: test sc-cargo
        run: cargo test -p sc-cargo
      - name: test sc-cli
        run: cargo test -p sc-cli
      - name: test sc-comply
        run: cargo test -p sc-comply
      - name: test sc-comply-author
        run: cargo test -p sc-comply-author
      - name: test sc-context
        run: cargo test -p sc-context
      - name: test sc-core
        run: cargo test -p sc-core
      - name: test sc-craft-ui
        run: cargo test -p sc-craft-ui
      - name: test sc-daemon
        run: cargo test -p sc-daemon
      - name: test sc-editor
        run: cargo test -p sc-editor
      # **sc-eval has taken this job's 30-minute bound four runs running.** Every
      # other crate finishes in seconds; this one starts and never returns, and
      # because a killed job uploads no log for the running step, splitting by
      # crate could name the crate and nothing more.
      #
      # One real cost was found and fixed at the source: the retrieval
      # determinism test walked and parsed this entire repository a second time
      # (`retrieval.rs`), 45s -> 16s. That was not the whole of it — the live log
      # shows the run reaching `solver::tests` and stopping there.
      #
      # `SC_EVAL_VERIFY_TIMEOUT_SECS` bounds each `verify` call, which is the only
      # thing in this crate that waits on a spawned process. The tests here verify
      # two-line shell scripts, so 20 seconds is enormous; the production default
      # is 300s and is deliberately left alone. A stalled command now fails its
      # own task in seconds and the assertion names the test, instead of the
      # 300s-per-task wait that silently consumed the job.
      #
      # **The compile stays its own step.** Not for speed — it is four seconds —
      # but because splitting it is the measurement that proved the 22 minutes was
      # the run and not the build.
      #
      # Deliberately NOT wrapped in `timeout`: that was tried, and `timeout`
      # signals `cargo` rather than the stuck test binary beneath it, so the step
      # ran 12 minutes past a 300-second bound. Bounding belongs on the job, where
      # GitHub enforces it from outside the runner.
      - name: build sc-eval tests
        run: cargo test -p sc-eval --no-run
      - name: test sc-eval
        env:
          # Two different timeouts, on two different paths, and the first alone
          # was not enough. `SC_EVAL_VERIFY_TIMEOUT_SECS` bounds sc-eval's own
          # `verify`; the run with only that set still stalled 27 minutes, which
          # is what proved the wait is NOT there. `SC_COMMAND_TIMEOUT_SECS`
          # bounds `sc_verify::run_command` — the agent's shell path, default
          # 240s — which is what the solver tests actually go through.
          SC_EVAL_VERIFY_TIMEOUT_SECS: 20
          SC_COMMAND_TIMEOUT_SECS: 20
          # Prints, from a background thread, which task and phase is still
          # running after 60s. A job killed by `timeout-minutes` uploads no log
          # for the step that was running, so anything that only prints at the
          # end is unrecoverable -- three attempts at that produced nothing. This
          # lands in the live output before the kill, and the last line printed
          # names the phase that never finished.
          SC_EVAL_WATCHDOG_SECS: 60
        # **`setsid` + `timeout -s KILL`, because plain `timeout` did not hold.**
        #
        # `timeout cargo test` signals `cargo`, which does not pass it on to the
        # stuck test binary underneath — measured: the step ran 12 minutes past a
        # 300-second bound. Running under `setsid` puts the whole thing in its own
        # process group, and `--kill-after` then SIGKILLs that group, so the
        # binary cannot outlive the deadline.
        #
        # This is what makes the step COMPLETE instead of the job being killed —
        # and a completed step uploads its log, where a killed job uploads
        # nothing for the step that was running. That is the difference between a
        # diagnosis and eight runs of silence.
        run: |
          set +e
          setsid timeout --signal=INT --kill-after=30s 600s cargo test -p sc-eval -- --test-threads=1 --nocapture
          rc=$?
          set -e
          if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
            echo "::error::sc-eval hit the 600s bound. The last test name printed above is the one that never finished."
          fi
          exit $rc
      - name: test sc-flame
        run: cargo test -p sc-flame
      - name: test sc-fsutil
        run: cargo test -p sc-fsutil
      - name: test sc-gateway
        run: cargo test -p sc-gateway
      - name: test sc-index
        run: cargo test -p sc-index
      - name: test sc-iterate
        run: cargo test -p sc-iterate
      - name: test sc-model
        run: cargo test -p sc-model
      - name: test sc-plugin-agent
        run: cargo test -p sc-plugin-agent
      - name: test sc-plugin-claude
        run: cargo test -p sc-plugin-claude
      - name: test sc-plugin-comply
        run: cargo test -p sc-plugin-comply
      - name: test sc-plugin-proto
        run: cargo test -p sc-plugin-proto
      - name: test sc-proto
        run: cargo test -p sc-proto
      - name: test sc-review
        run: cargo test -p sc-review
      - name: test sc-server
        run: cargo test -p sc-server
      - name: test sc-swarm
        run: cargo test -p sc-swarm
      - name: test sc-tools
        run: cargo test -p sc-tools
      - name: test sc-trace
        run: cargo test -p sc-trace
      - name: test sc-tui
        run: cargo test -p sc-tui
      - name: test sc-verify
        run: cargo test -p sc-verify
      - name: test sc-web
        run: cargo test -p sc-web
      - name: test sc-win
        run: cargo test -p sc-win
      - name: test sc-workflow
        run: cargo test -p sc-workflow


  # The slow suites, and the reports worth reading: retrieval ranking (spec 23),
  # the gateway routing benchmark, and spec-anchor drift (spec 17).
  #
  # **Deliberately not blocking.** These catch real regressions — a stale spec
  # anchor, a query that stopped finding its function — but none of them is a
  # reason to refuse a merge on its own, and a red build nobody can act on
  # immediately is a red build people learn to ignore.
  #
  # No `needs:` — it runs beside `check` rather than after it, so a report is not
  # withheld by a failing gate. It pays for its own web build for the same
  # `include_str!` reason: `trace --check` compiles sc-server's tree.
  reports:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: system libraries for the GUI crate
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libfontconfig1-dev libfreetype6-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: build the web interface
        working-directory: web
        run: |
          npm ci
          npm run build

      # QUOTED, and it must stay quoted. `retrieval::` ends in a colon, so the
      # following space makes YAML read the rest as a mapping key rather than
      # part of the command. Unquoted, this exact line took the self-hosted CI
      # down for weeks: the whole pipeline set was rejected at parse time, so
      # every push, PR and tag errored before a single step ran — invisible
      # unless someone opened the CI list, because the local gate stayed green.
      - name: retrieval ranking
        run: "cargo test --quiet -p sc-eval retrieval:: -- --nocapture"

      # **Which sc-eval test hangs.** Here rather than in `check` because this
      # job is `continue-on-error` and therefore always COMPLETES — and only a
      # completed job uploads its logs. `check` is killed by `timeout-minutes`
      # with `test sc-eval` still running, and the archive for such a run holds
      # this job and nothing else; that is why eight attempts to instrument the
      # real step produced no evidence at all.
      #
      # Each module is bounded and reported separately, so the one that times
      # out names itself in a log that survives. `|| true` per module so one
      # hang does not hide the modules after it.
      - name: which sc-eval module hangs
        env:
          SC_EVAL_VERIFY_TIMEOUT_SECS: 20
          SC_COMMAND_TIMEOUT_SECS: 20
        run: |
          # `set +e` for the whole block: the runner uses `bash -e`, so the first
          # module that exits non-zero aborts the script and everything after it
          # goes unreported -- which is what happened on the first attempt, where
          # the log stopped dead after `retrieval` with no verdict for `runner`.
          set +e
          cargo test -p sc-eval --no-run 2>&1 | tail -2
          for m in fsutil pi_arm raw_arm report results retrieval runner solver task; do
            start=$(date +%s)
            timeout --signal=KILL 120s cargo test -p sc-eval --lib "${m}::" -- --test-threads=1 >/tmp/$m.log 2>&1
            rc=$?
            end=$(date +%s)
            if [ $rc -eq 137 ] || [ $rc -eq 124 ]; then
              echo "HUNG: $m exceeded 120s"
              tail -30 /tmp/$m.log
            elif [ $rc -ne 0 ]; then
              echo "FAILED: $m rc=$rc in $((end-start))s"
              tail -30 /tmp/$m.log
            else
              echo "ok: $m in $((end-start))s"
            fi
          done
          for t in suite_smoke suite_shape gateway_ab; do
            start=$(date +%s)
            timeout --signal=KILL 120s cargo test -p sc-eval --test "$t" -- --test-threads=1 >/tmp/$t.log 2>&1
            rc=$?
            end=$(date +%s)
            if [ $rc -eq 137 ] || [ $rc -eq 124 ]; then
              echo "HUNG: test/$t exceeded 120s"
              tail -30 /tmp/$t.log
            elif [ $rc -ne 0 ]; then
              echo "FAILED: test/$t rc=$rc in $((end-start))s"
              tail -30 /tmp/$t.log
            else
              echo "ok: test/$t in $((end-start))s"
            fi
          done

      - name: gateway routing benchmark
        run: cargo test --quiet -p sc-gateway --test bench -- --nocapture

      - name: spec-anchor drift
        run: cargo run --quiet -p sc-cli -- trace --check
