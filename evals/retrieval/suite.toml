# The retrieval eval (spec 23 — Measurement).
#
# Model-free, GPU-free, deterministic. Search is a pure function of the repo bytes
# and the question, so this suite needs no flakiness allowance and no live backend:
# it runs inside scripts/check.sh like any unit test, and a regression in ranking
# fails the build instead of quietly making investigations worse.
#
# Each entry is a question asked THE WAY A USER ASKS IT — vague, symptom-first, in
# the user's words rather than the code's. That is the whole point: a query written
# in the code's vocabulary is a query the old grep already answered.
#
# Grading is "the expected target appears in the top-k hits":
#   strict = 5   the model would see it near the top of a lead block
#   loose  = 25  it is at least in the result set
# A query with `symbol` set must match that symbol; with only `path`, any hit in
# that file counts.
#
# Fixtures:
#   fixtures/starfield        the real void-claim starfield.rs plus siblings, so
#                             the canonical question has somewhere to be wrong.
#   ../ladder/tasks/*/fixture the engine slices the ladder already carries.
#   ../..                     this repo, which is the largest and least forgiving
#                             fixture available and the one being searched daily.
#                             The suite's own directory is excluded when it is the
#                             fixture -- see the runner. A file containing every
#                             question verbatim would otherwise win every query.

# ---------------------------------------------------------------------------
# The canonical entry. The question that motivated the whole spec, asked exactly
# as the user asked it. `draw_trails` must be the top hit.
# ---------------------------------------------------------------------------
[[queries]]
id = "starfield-trail-thickness"
question = "why on the jump screen is the trail behind the stars thin before it gets thick? it should be the other way around"
fixture = "fixtures/starfield"
path = "src/fx/starfield.rs"
symbol = "draw_trails"
strict = true

# The same file, asked a different way: no jargon at all, just the symptom.
[[queries]]
id = "starfield-streaks-wrong-way"
question = "the streaks coming off the stars look backwards"
fixture = "fixtures/starfield"
path = "src/fx/starfield.rs"
strict = true

# A neighbouring concern in the same fixture, to prove the index is discriminating
# rather than just always answering starfield.rs.
[[queries]]
id = "starfield-hud-bar"
question = "where is the bar that shows how much hull is left drawn"
fixture = "fixtures/starfield"
path = "src/ui/hud.rs"
symbol = "draw_hull_bar"
strict = true

# A FOLLOW-UP question, in the shape the chat path now hands to an investigation:
# a bounded preamble naming the previous exchange, then the question itself.
#
# Seeded because the suite could not previously catch this class of bug at all --
# every other query here is a standalone question, and the live failure was a
# follow-up ("can you plan out that fix") arriving with its referent stripped. The
# index must still find the right file when the question is wrapped this way, or
# resolving the pronoun would fix the model's confusion and break its retrieval.
[[queries]]
id = "starfield-follow-up"
question = """Earlier in this conversation:

The user asked: why is the trail behind the stars thin before it gets thick?

You answered: The trail is drawn as two segments in draw_trails. The fix is to swap the two widths.

Now answer this, resolving any reference it makes to the above:

Can you plan out that fix"""
fixture = "fixtures/starfield"
path = "src/fx/starfield.rs"
symbol = "draw_trails"
strict = true

