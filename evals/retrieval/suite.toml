# ---------------------------------------------------------------------------
# KNOWN MISSES — kept, and kept failing-by-declaration, because deleting a query
# a lexical index cannot answer would hide exactly the evidence that decides
# whether it ever needs help.
#
# `expect = "miss"` asserts the target is NOT found. That reads backwards until
# you consider the alternative: a suite of only-winnable questions measures
# nothing, and silently becomes a suite of questions somebody tuned the ranker
# against. These two are the recorded shape of the gap, and if a future change
# starts answering one, this suite goes red and says so.
#
# Both fail for the same reason, which is the honest limit of a lexical core: the
# user's words and the code's words genuinely do not overlap. The grammar file
# says "constraint", "GBNF", "malformed"; it never says "json instead of prose".
# The permission gate says "confirm", "side effect", "destructive"; it never says
# "delete files". Per spec 23, the sanctioned fix if these ever matter enough is
# query expansion via the orchestrator model -- a rewritten query, still scored by
# this same deterministic index -- not embeddings.
# ---------------------------------------------------------------------------
[[queries]]
id = "sc-grammar-constrained"
question = "how do we force the model to reply with valid json instead of prose"
fixture = "../.."
path = "crates/sc-tools/src/grammar.rs"
expect = "miss"

[[queries]]
id = "sc-tool-permission"
question = "what stops the agent running a command that would delete files"
fixture = "../.."
path = "crates/sc-core/src/agent/dispatch.rs"
expect = "miss"
