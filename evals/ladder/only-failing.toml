# The hardest rung: one feature, two call sites, a real cargo crate.
#
# Everything above is a single file. This is a crate with the engine's real `glam`
# dependency (TileGrid uses DVec2; stripping it would change the code under test),
# a lib with four modules, and an integration test — so `cargo test` is the verify
# command, as it would be in the real repo. Affordable because glam is already in
# the local cargo cache: a cold build here is ~4 seconds, against minutes for the
# full engine.
#
# What makes it hard is not the algorithm. The flood-fill already exists, correct,
# in `floor.rs`. The work is recognising it is a property of a GRID rather than of
# a station, moving it without changing its behaviour, and then using it from two
# consumers that never shared code before. A model that only edits the file the
# tests name will fail: the tests demand the primitive on TileGrid AND both
# wrappers delegating to it.

[[tasks]]
id = "engine-grid-scan"
description = """
This crate is a slice of a real game. `tilegrid.rs` is the engine's generic \
`TileGrid<T>`; `floor.rs` (a station interior) and `module.rs` (a ship module) \
each own one and wrap it.

`Floor` has two grid scans written directly against itself: `find_first` (first \
tile of a kind, row-major) and `tile_regions` (contiguous tiles of a kind grouped \
into rectangles by a 4-connected flood-fill). `Module` has neither, though it is \
the same kind of grid and needs the same queries.

Lift both into `TileGrid` as `find_first` and `regions`, then use them from BOTH \
consumers: `Floor::find_first` and `Floor::tile_regions` must keep their exact \
current names and behaviour but delegate to the engine, and `Module` must gain \
`find_first` and `tile_regions` doing the same.

`cargo test` must pass. Do not edit tests/contract.rs."""
fixture = "tasks/engine-grid-scan/fixture"
solution = "tasks/engine-grid-scan/solution"
verify_cmd = "cargo test --offline -q"
contract_tests = ["tests/contract.rs"]
tags = ["rung:engine-multi-site", "lang:rust", "source:void-claim"]
timeout_secs = 300

# Harder still: a feature that cannot be copied from anywhere.
#
# `engine-grid-scan` asks for a MOVE -- the flood-fill already exists and is
# correct, so the work is recognising where it belongs. This one asks for code
# that is not in the crate at all: a type-erased, generational-index ECS query
# with an exclusion term, matching the borrow discipline of the `iter2` beside it
# (raw-pointer collect, then safe refs). Three type parameters, one of which may
# have no storage at all.
#
# The two consumers each hand-roll the same O(n*m) workaround -- collect the
# marked set, then `contains` per candidate -- so the duplication is real and the
# fix is one query used twice. The recycled-slot test is the trap: `despawn`
# clears component slots, and a solver who reasons about generations without
# reading `despawn` will get it wrong in a way the happy-path tests miss.

[[tasks]]
id = "engine-ecs-query"
description = """
This crate is a slice of a real game engine. `world.rs` is a generational-index \
ECS with type-erased component storage; `physics.rs` and `render.rs` are two \
systems that query it.

The ECS can express "entities with A and B" (`iter2`) but not "entities with A \
and B but NOT C". Both systems want the second: physics must skip `Frozen` \
entities, render must skip `Hidden` ones. Each works around it the same way — \
collect every marked entity into a Vec, then `contains` it for each candidate.

Add `World::iter2_without::<A, B, C>()`, yielding `(EntityId, &A, &B)` for every \
live entity holding A and B but not C, and use it in BOTH systems in place of \
their hand-rolled filters. Match the liveness and generation rules of `iter2`.

`cargo test` must pass. Do not edit tests/contract.rs."""
fixture = "tasks/engine-ecs-query/fixture"
solution = "tasks/engine-ecs-query/solution"
verify_cmd = "cargo test --offline -q"
contract_tests = ["tests/contract.rs"]
tags = ["rung:engine-novel-generic", "lang:rust", "source:void-claim"]
timeout_secs = 300

# --- Cross-file rungs -------------------------------------------------------
#
# WHY THESE EXIST -- do not delete them as redundant with the rungs above.
#
# Measured 2026-09-07/08 on tiel-coder-35b, three arms (our harness / a bare
# model with native tool calling / the external pi agent) x 3 repeats: SIX of the
# ten rungs scored 3/3 for EVERY arm in EVERY round. Only `engine-diagonal-wired`,
# `engine-grid-scan`, `engine-ecs-query` and `engine-diagonal-path` moved at all.
# A suite where most tasks are solved by everyone ranks nothing; those six measure
# a floor that every arm already clears.
#
# What DID separate the arms was diagnostic distance plus CROSS-FILE work: a
# change made in one place that must then be propagated to every site depending
# on it. That is what a repo map and a stall detector buy you, and it is exactly
# what a bare model without either has to rediscover by recompiling.
#
# So each of these four requires edits in three or four files that a single-file
# reader cannot get right, and each carries a trap that a lazy propagation falls
# into:
#
#   rust-multi-site        a catch-all `_ =>` arm compiles but gives the wrong
#                          answer at all three match sites (verified).
#   rust-signature-change  one hard-coded deadline satisfies at most one of the
#                          four call sites; each needs a value only its own
#                          module's local context names.
#   rust-hidden-invariant  the loud failure is in wrap.rs; the cause is in
#                          span.rs, and patching wrap.rs alone leaves
#                          highlight::rendered_rows wrong (verified).
#   rust-trait-impl        the three impls need genuinely different bodies;
#                          delegating without namespacing the key compiles and
#                          fails (verified).
#
# Same rules as the rungs above: Rust only, std only, single `rustc --test` over
# a `#[path = "..."] mod` chain rooted at test.rs, and a unique exe name per task
# so parallel and repeat runs cannot collide.

[[tasks]]
id = "rust-multi-site"
description = """
The daemon's `Event` enum needs a fourth kind: `Cancelled { id: u32, by: String }`, \
emitted when a human stops a job before it finishes.

Add the variant and handle it everywhere it is now matched. A cancelled job is \
something an operator should see, but it must never be retried automatically — \
retrying what somebody deliberately stopped is the wrong answer. Its status line \
reads `#<id> cancelled by <who>`.

Leave the existing three variants behaving exactly as they do now. The tests in \
test.rs specify all of this; make them pass."""
fixture = "tasks/rust-multi-site/fixture"
solution = "tasks/rust-multi-site/solution"
verify_cmd = "rustc --test --edition 2021 -o t_multi_site.exe test.rs && ./t_multi_site.exe"
contract_tests = ["test.rs"]
tags = ["rung:cross-file-variant", "lang:rust"]
timeout_secs = 300
