# A Portainer stack for the hosted intake surface (spec 18).
#
# Paste this into Portainer → Stacks → Add stack, set SC_SERVER_DAEMON_KEY in the
# environment section, and deploy. Nothing else in this workspace is involved —
# the daemon on the developer's machine dials out to this, and this never calls
# back.
#
# Generate the key with:
#     openssl rand -hex 32
#
# The same value goes in the daemon's config. It is the only thing that lets a
# daemon claim work, so treat it like a password: 32+ random characters, and the
# server refuses to start with anything shorter.
#
# ---------------------------------------------------------------------------
# What you get with nothing but the key set: a private review surface. Enrol a
# browser with the code printed to the log, file requests, read drafted specs,
# approve or send back. Nobody else can reach anything.
#
# Setting SC_SERVER_PUBLIC_REPO additionally opens a public filing surface —
# sign in by email, file a request, watch your own. That half is themed, has a
# light/dark control and reads in English or French; the review half stays
# private and is not translated, because it has one reader.
# ---------------------------------------------------------------------------
#
# BACK UP THE VOLUME. Credentials in it are hashed, so a copy grants nobody
# access — but it is the only copy of every filed request and drafted spec, and
# nothing else in this system holds them.

services:
  sc-server:
    # `latest` moves only on a `v*` tag, never on a push to main — so pulling it
    # gets a version somebody chose to release, not whatever landed last.
    #
    # **Set SC_SERVER_TAG if you deployed this stack from a git tag.** Portainer
    # can pin the stack to `refs/tags/v0.0.3`, and doing so is the careful
    # instinct — but the *image* reference here would still float, so the next
    # release moves your container while the stack reference says it did not.
    # Pinning one without the other is the mismatch worth avoiding: set
    # SC_SERVER_TAG to the same version and the two agree.
    #
    # TO STOP MAINTAINING THE VERSION BY HAND, do the opposite — float both:
    # point the stack's git reference at `refs/heads/main` and leave
    # SC_SERVER_TAG unset. Then `latest` is the only version you track, and it
    # moves only on a release.
    #
    # Make releases deploy themselves with the stack's WEBHOOK, not with git
    # polling. Polling redeploys when the repo ref moves, and cutting a tag does
    # not move `refs/heads/main` — so a release containing no change to this
    # file would never be noticed. Instead:
    #
    #   1. Portainer → this stack → Webhooks → create one, and copy the URL.
    #   2. Enable **"Re-pull image"** on it. Without that Portainer reuses the
    #      cached layers for `latest` and the redeploy changes nothing —
    #      silently, and looking just like success.
    #   3. Add the URL to Woodpecker as the `sc_server_portainer_webhook` repo
    #      secret.
    #
    # `.woodpecker/image.yml` then POSTs it after each `v*` tag push, and
    # `git push origin v0.1.0` becomes the whole deployment procedure. The
    # webhook URL is the credential — it carries no token, so anyone who can
    # reach it can trigger a redeploy.
    #
    # A `manifest unknown` or `unauthorized` here means the package is PRIVATE.
    # GitHub Packages does not inherit repository visibility: a package linked to
    # a public repo inherits its access *permissions* but is still published
    # private by default. Make it public in the package's settings (Danger Zone →
    # Change visibility), or give Portainer a registry credential — a GitHub
    # username and a classic token with `read:packages`.
    #
    # Note that public is one-way: GitHub does not allow a public package to be
    # made private again.
    image: ghcr.io/jamez667/sc-server:${SC_SERVER_TAG:-latest}
    container_name: sc-server
    restart: unless-stopped

    # ------------------------------------------------------------------------
    # LOGS
    #
    # The server writes **one JSON object per line to stdout**. Docker captures
    # it, and whatever scrapes Docker logs on this host picks it up with no
    # configuration here.
    #
    # There is deliberately no `logging:` block. A scraper reads the `json-file`
    # driver's files on disk, so setting the driver to anything else here would
    # silently break a pipeline this file cannot see — and this file has no way
    # to know what the host runs.
    #
    # QUERY ON `svc`, NOT THE CONTAINER NAME. Every line carries
    # `"svc":"sc-server"`. Under Swarm the container name includes a task id
    # that changes on every redeploy, so a dashboard pinned to it quietly stops
    # matching the next time this deploys. The field does not move.
    #
    #   {container=~"sc-server.*"} | json | svc="sc-server"
    #   {container=~"sc-server.*"} | json | msg="request" | poll="false"
    #   {container=~"sc-server.*"} | json | level=~"warn|error"
    #
    # Access lines carry a route *label* from a fixed set — never the URL as
    # sent. Sign-in tokens, query strings, cookies, addresses and client IPs are
    # deliberately absent; see `route_label` in `crates/sc-server/src/serve.rs`.
    #
    # THE LOG IS AS PUBLIC AS WHATEVER READS IT — see SC_SERVER_ENROL_CODE.
    # ------------------------------------------------------------------------

    environment:
      # REQUIRED — one of these two. With neither, the server refuses to start
      # rather than running open: an unauthenticated intake surface on the
      # public internet is the failure this whole design exists to prevent.
      #
      # ONE KEY PER DAEMON, as `label:key` pairs:
      #
      #     SC_SERVER_DAEMON_KEYS=laptop:0123…,office:89ab…
      #
      # The label is not a secret — it appears in the log and identifies which
      # machine claimed a piece of work. Labels must be unique and no two
      # daemons may share a key, because both would make "revoke that one
      # machine" quietly untrue.
      #
      # WHY NOT ONE SHARED KEY. It collapses three things that should be per
      # machine: the rate budget (a daemon stuck in a retry loop on one host
      # starves the others), revocation (rotating locks out every machine at
      # once), and the holder of a claim — a late report from a daemon presumed
      # dead can otherwise overwrite a draft another machine is still writing.
      #
      # Revoke one machine by deleting its pair here and redeploying. Nothing on
      # the other daemons needs touching.
      SC_SERVER_DAEMON_KEYS: ${SC_SERVER_DAEMON_KEYS:-}

      # The single-key form, still read so an install that predates the plural
      # keeps working without a stack edit. It is filed under the label
      # `default`. Set both while migrating: a second daemon can be added here
      # before the first one is moved across.
      SC_SERVER_DAEMON_KEY: ${SC_SERVER_DAEMON_KEY:-}

      # Optional. When unset, a single-use enrolment code is generated and
      # logged on first start — so a fresh install is usable without
      # pre-configuration but is never open.
      #
      # THAT LOG LINE IS A CREDENTIAL. It goes wherever this host ships
      # container logs, so on a machine running a log aggregator, anyone who can
      # query the aggregator can enrol a device and reach the review surface.
      # The code therefore EXPIRES 30 MINUTES after it is minted (a restart arms
      # a fresh one, so letting it lapse costs nothing). Enrol promptly, or set
      # this to a value of your own — one set here is never logged.
      SC_SERVER_ENROL_CODE: ${SC_SERVER_ENROL_CODE:-}

      # The key the settings stored on the VOLUME are encrypted with.
      #
      # Some settings have to be replayed rather than merely compared -- a
      # mail API key is sent to Brevo, a GitHub client secret is sent to
      # GitHub -- so they cannot be stored as hashes the way device tokens
      # and daemon keys are. Once they are editable from the review surface
      # they live on the volume, and they are encrypted there.
      #
      # THIS IS THE ONE SECRET THAT MUST STAY HERE. It is what makes the
      # volume safe to back up and copy: a key stored beside its own
      # ciphertext protects nothing. Someone who takes a copy of /data and
      # not this line has taken nothing usable.
      #
      # Generate one with `openssl rand -hex 32`, or leave it unset and read
      # the one this server logs on a first start. LOSING IT means the stored
      # secrets cannot be read and have to be entered again -- it is not a
      # lockout, since who administers this server is recorded separately.
      #
      # A server that has never been given a secret through the UI does not
      # need one. A WRONG one is refused at startup rather than quietly
      # behaving as though nothing were configured.
      SC_SERVER_SECRET_KEY: ${SC_SERVER_SECRET_KEY:-}

      # These carry their defaults *inside the image*, so they are substituted
      # to their real values rather than to an empty string. Passing an empty
      # one is not the same as leaving it unset: `SC_SERVER_DATA=""` overrides
      # the image's `ENV SC_SERVER_DATA=/data` and the server tries to write to
      # `/`, which fails with a bare "Permission denied" that says nothing about
      # the cause.
      SC_SERVER_BIND: ${SC_SERVER_BIND:-0.0.0.0}
      SC_SERVER_PORT: ${SC_SERVER_PORT:-8420}
      SC_SERVER_DATA: ${SC_SERVER_DATA:-/data}

      # ---------------------------------------------------------------------
      # The PUBLIC surface — anyone with an email address can file a request.
      #
      # OFF unless SC_SERVER_PUBLIC_REPO is set. Setting it makes the rest
      # required: the server refuses to start half-public rather than accepting
      # filings it cannot send a sign-in link for.
      #
      # Reviewing stays private either way — an account holder can file and read
      # their own requests and nothing else.
      # ---------------------------------------------------------------------

      # The repositories public filings may be attributed to, comma separated:
      #
      #     SC_SERVER_PUBLIC_REPOS=smart-coder,memosy
      #
      # These are NAMES, each resolved by your daemon against its own configured
      # set — so every one of them needs a matching `queue add-repo` on the
      # daemon, spelled identically, or filings for it queue and never drain.
      # (The review page says so when that happens, naming the repository.)
      #
      # With more than one, the filing form offers a picker and the filer
      # chooses; a repository not in the enabled set is refused rather than
      # quietly filed against another. Setting this also requires
      # SC_SERVER_PUBLIC_SITE_NAME, since a masthead cannot be derived from a
      # set.
      #
      # NAMING SOMETHING HERE IS WHAT TURNS THE PUBLIC SURFACE ON, and that
      # switch stays in this file deliberately — a server that could open its
      # own public surface from a UI is a different security posture.
      #
      # The LIST, though, is a SEED. Like SC_SERVER_OWNERS below it is applied
      # once on a fresh volume and ignored after that, with a log line saying
      # so; add and remove repositories at /repos on the review surface. Editing
      # this on a volume that has already started changes nothing except
      # whether the surface exists at all.
      #
      # Point these at scratch repositories rather than your main ones: public
      # work queues behind your own work in the same repository.
      SC_SERVER_PUBLIC_REPOS: ${SC_SERVER_PUBLIC_REPOS:-}

      # The single-repository form, still read so an install that predates the
      # plural keeps working without a stack edit. Both together are a union,
      # which is how a second repository is added before this one is tidied
      # away. Setting either turns the public surface on.
      SC_SERVER_PUBLIC_REPO: ${SC_SERVER_PUBLIC_REPO:-}

      # A SEED for the owner list, applied ONCE on a fresh volume:
      #
      #     SC_SERVER_OWNERS=jamez667:smart-coder|memosy,someone:memosy
      #
      # `|` between one owner's repositories, `,` between owners.
      #
      # OWNERS LIVE ON THE VOLUME, NOT HERE. Administer them at /owners on the
      # review surface, from an enrolled device. This setting exists so an
      # existing install keeps its owners across the move, and so a fresh one
      # can be bootstrapped without a browser.
      #
      # It is applied once and then ignored — the server logs that it is
      # ignoring it. Re-applying on every boot would resurrect an owner revoked
      # through the UI, which is the failure revocation exists to prevent
      # arriving by the back door of a restart. Editing this on a volume that
      # has already started changes nothing.
      #
      # An owner signs in with GitHub and may READ the drafted specs for their
      # own repositories, DECLINE them (send back, discard) and UNBLOCK ones
      # screening held (release). They may not ACCEPT, and they may not add an
      # owner.
      #
      # Release is the one owner action that reaches your machine — a released
      # request is drafted again — so it is bounded by
      # SC_SERVER_PUBLIC_MAX_DRAFTS per repository per day, same as your own
      # send-backs. Accepting settles a request instead, and that stays with
      # you. Building it is the IDE's job either way: nothing on the public
      # surface runs a pipeline.
      #
      # NOTHING IS CHECKED AGAINST GITHUB. Signing in proves who somebody is;
      # the roster is the only thing deciding what they may see. Treat it the
      # way you would a repository's collaborator list.
      #
      # Empty is the resting state: no owner role at all.
      SC_SERVER_OWNERS: ${SC_SERVER_OWNERS:-}

      # The GitHub OAuth application that owners sign in with.
      #
      # Create one at GitHub -> Settings -> Developer settings -> OAuth Apps.
      # The callback URL must be your SC_SERVER_PUBLIC_BASE_URL followed by
      # /public/auth/github/callback — GitHub uses the one registered there, so
      # it is not sent by this server and cannot be varied by a caller.
      #
      # Both or neither: an id without a secret sends people to GitHub and
      # cannot finish the exchange, so the server refuses to start rather than
      # showing a sign-in button that always fails. Naming owners without an
      # application is refused for the same reason.
      #
      # The client id is public — it appears in the URL. The SECRET never leaves
      # this server: it is used only in the server-to-server token exchange.
      SC_SERVER_GITHUB_CLIENT_ID: ${SC_SERVER_GITHUB_CLIENT_ID:-}
      SC_SERVER_GITHUB_CLIENT_SECRET: ${SC_SERVER_GITHUB_CLIENT_SECRET:-}

      # What the masthead calls this site. Defaults to PUBLIC_REPO.
      #
      # Separate from it because that one is a ROUTING KEY the daemon matches
      # exactly against its own `queue add-repo` names — a mismatch there is a
      # queue that silently never drains. A heading wants the name a person
      # recognises, so set this to `owner/repo` and leave the routing alone.
      SC_SERVER_PUBLIC_SITE_NAME: ${SC_SERVER_PUBLIC_SITE_NAME:-}

      # https, absolute. Sign-in links are built from it, and it is NOT inferred
      # from the Host header — that is attacker-controlled, so a link built from
      # it would send the filer to whatever host the request claimed to be.
      SC_SERVER_PUBLIC_BASE_URL: ${SC_SERVER_PUBLIC_BASE_URL:-}

      # brevo | resend | postmark
      SC_SERVER_MAIL_PROVIDER: ${SC_SERVER_MAIL_PROVIDER:-}
      SC_SERVER_MAIL_KEY: ${SC_SERVER_MAIL_KEY:-}
      SC_SERVER_MAIL_FROM: ${SC_SERVER_MAIL_FROM:-}
      SC_SERVER_MAIL_FROM_NAME: ${SC_SERVER_MAIL_FROM_NAME:-}

      # ---------------------------------------------------------------------
      # LOCAL ONLY. Prints sign-in links to the container log instead of
      # emailing them, so you can try the surface without a mail provider.
      #
      # A sign-in link is a credential, so this hands an account to anyone who
      # can read the log. The server REFUSES TO START with it set unless
      # PUBLIC_BASE_URL is a loopback address — it cannot be switched on here by
      # accident. With it on, the MAIL_ settings above are not needed.
      # ---------------------------------------------------------------------
      SC_SERVER_MAIL_TO_CONSOLE: ${SC_SERVER_MAIL_TO_CONSOLE:-}

      # The spam screener. ABSENT means filings are not screened at all, which
      # is honest — a server that pretends to screen is worse than one that
      # plainly does not. It runs here, so it never sees your machine or code.
      #
      # It can only ever WITHHOLD: a quarantined filing is kept, shown to you,
      # and released in one click. Every unexpected outcome — timeout, garbled
      # reply, no key, HTTP 500 — is indistinguishable from approval, so a
      # screener that breaks cannot become an off-switch for your intake.
      #
      # Turning it on does NOT screen filings already in the queue.
      SC_SERVER_SCREEN_KEY: ${SC_SERVER_SCREEN_KEY:-}

      # Both optional; these are the defaults. Any OpenAI-compatible endpoint
      # works, so a different provider is a URL and a model name.
      SC_SERVER_SCREEN_URL: ${SC_SERVER_SCREEN_URL:-}
      SC_SERVER_SCREEN_MODEL: ${SC_SERVER_SCREEN_MODEL:-}

      # Spend ceilings. These are what stand between a hostile signup and your
      # model bill, so the defaults are deliberately not generous.
      #
      #   MAX_DAILY     requests one account may file per rolling 24h. Every
      #                 filing that clears the screener costs a real drafting
      #                 run on YOUR machine.
      #   MAX_ACCOUNTS  how many accounts may exist. This is what the per-account
      #                 cap rests on: an id an attacker cannot vary is one they
      #                 can re-mint with a disposable address.
      #   MAX_LINKS     unspent sign-in links outstanding at once — the ceiling
      #                 on MAIL spend. The rate limiter shapes traffic, but
      #                 thirty a minute sustained is tens of thousands a day.
      #                 Refused before the mailer is called, so a flood is free.
      #
      # None may be 0 — the server refuses to start rather than accept nothing
      # while looking configured. To turn the public surface off, leave
      # PUBLIC_REPO unset, which turns it off honestly.
      #
      # Raising MAX_ACCOUNTS is the lever when signup stops; revoking does NOT
      # make room, because a revoked account keeps its slot. That is deliberate:
      # a revoked address can never be re-created, so counting only live
      # accounts would let an attacker's burned identities be swapped one for
      # one under a wall that looks intact.
      SC_SERVER_PUBLIC_MAX_DAILY: ${SC_SERVER_PUBLIC_MAX_DAILY:-}

      # Drafting runs one repository may be sent into per rolling 24h.
      #
      # THE ONLY CAP THAT BOUNDS WHAT IS ACTUALLY SPENT. MAX_DAILY above limits
      # what a stranger may FILE, and never limited re-admission: a request that
      # has already been filed re-enters the queue for nothing every time it is
      # sent back or released, and each re-entry is a full drafting run on your
      # machine. A send-back loop was unbounded before this existed.
      #
      # Per repository rather than per person, because what is being spent is
      # runs against a project — a number that stays true when a second owner is
      # added, where a per-person cap would simply double. Your own send-backs
      # count too: the cap says what a project may cost in a day.
      SC_SERVER_PUBLIC_MAX_DRAFTS: ${SC_SERVER_PUBLIC_MAX_DRAFTS:-}
      SC_SERVER_PUBLIC_MAX_ACCOUNTS: ${SC_SERVER_PUBLIC_MAX_ACCOUNTS:-}
      SC_SERVER_PUBLIC_MAX_LINKS: ${SC_SERVER_PUBLIC_MAX_LINKS:-}

      # Whether a filer reads the spec drafted from their request. Defaults ON.
      # That spec is model output produced by reading your repository, and the
      # filer wrote the prompt that produced it — turn it off for a repository
      # whose contents should not be described to strangers.
      SC_SERVER_PUBLIC_SHOW_SPEC: ${SC_SERVER_PUBLIC_SHOW_SPEC:-}

      # There is no setting for the claim timeout, and that is on purpose.
      #
      # Claiming is serialised per repository, so a daemon that dies mid-draft
      # would hold that repo for ever — nothing else for it could be claimed
      # again, silently. A claim therefore expires after twenty minutes and the
      # request returns to the queue with a note saying why.
      #
      # Not configurable because the two failures are not symmetric: too short
      # reclaims a LIVE draft and puts two daemons on one tree, while too long
      # only delays a repo whose daemon is already dead. Tuning it down for
      # snappiness buys duplicate work, so the trade is not offered.

    ports:
      # Put a reverse proxy in front of this and terminate TLS there. The server
      # speaks plain HTTP by design: certificates, renewal and a private key
      # inside the container are three failure modes solving a problem the proxy
      # already solves.
      - "8420:8420"

    volumes:
      # The one volume: requests, drafted specs, and credentials. Credentials are
      # stored hashed, so a copy of this volume grants nobody access — but it is
      # the only copy of the developer's filed requests, so back it up.
      - sc-server-data:/data

    # The image already runs as uid 10001; stated here so it survives a stack
    # edit that regenerates the compose file.
    user: "10001:10001"

    # It holds text and needs no privilege beyond writing one directory.
    security_opt:
      - no-new-privileges:true

volumes:
  sc-server-data:
