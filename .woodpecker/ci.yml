# Woodpecker CI — runs the same gates as scripts/check.sh.
# Self-hosted (no GitHub Actions). See CONTRIBUTING.md.
#
# One step: Woodpecker gives each step a fresh container sharing only the cloned
# workspace volume, so system packages installed in one step don't persist to
# the next. Installing deps and running the gates in a single step keeps it
# correct and lets them share one `target/` build.
#
# **Node is installed here because the server does not compile without it.** The
# browser interface is built by Vite and embedded with `include_str!`, so its
# output is a compile-time input rather than a packaging step — see spec 18 for
# why that trade was made and what it cost.
#
# The workspace includes `sc-win`, an iced (winit/wgpu) GUI crate, so even a
# `cargo check` of the whole workspace on Linux needs the X11/Wayland/font dev
# libraries below. The rest of the stack is pure-Rust (ureq + rustls) — no
# OpenSSL/libssl required.

when:
  - event: [push, pull_request]
    branch: main

steps:
  - name: check
    # Pinned to match rust-toolchain.toml. rustup reads that file and installs the
    # pinned channel + rustfmt/clippy on the first cargo call, so local and CI run
    # the identical compiler and lint set. Bump both together, deliberately.
    image: rust:1.97.1-bookworm
    environment:
      CARGO_TERM_COLOR: always
    commands:
      # System libraries the iced/winit/wgpu GUI crate links against on Linux.
      # (No Python: full agent/interpreter integration tests are #[ignore]d and
      # don't run in CI — see below.)
      - apt-get update
      - >-
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        pkg-config
        libx11-dev libxcb1-dev libxrandr-dev libxi-dev
        libxkbcommon-dev libwayland-dev
        libfontconfig1-dev libfreetype6-dev
      # rust-toolchain.toml pins the channel; ensure its components are present
      # (no-op if rustup already auto-installed them).
      - rustup component add rustfmt clippy
      # **The interface, built before any cargo command touches sc-server.**
      # `include_str!` reads the bundle at compile time, so `cargo check` fails
      # outright without it — this is not an optional extra step, it is a
      # prerequisite of compiling at all.
      #
      # Nothing generated is committed, which is why this is here. The
      # alternative was checking a 150 kB build artifact into the tree, where a
      # stale one ships silently.
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
      # `npm ci`, not `npm install`: the lockfile decides. A dependency resolved
      # at build time is a dependency nobody chose, on the one component that
      # faces the network.
      - cd web && npm ci && npm run lint && npm run build && cd ..
      # The gates, in the same order as scripts/check.sh.
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo check --workspace
      # Full agent integration tests (live model backend, docker sandbox, or a
      # real python/pytest interpreter) are #[ignore]d, so the default
      # `cargo test` run stays deterministic and self-contained — no backend, no
      # interpreter, no network.
      - cargo test --workspace

  # The browser harness, in its own step because it needs a browser and a
  # running server — the two things `scripts/check.sh` deliberately does not.
  #
  # **It carries the tests the move to a client-rendered surface would otherwise
  # lose**: that the two review decisions are styled identically, that the
  # controls sit below the artifact they decide on, that the bypass is visible,
  # and that a signed-out stranger is shown no administrative route. Those were
  # asserted against rendered HTML in Rust and cannot be asserted against JSON.
  #
  # It builds the image and drives it, so what is tested is what ships.
  - name: browser
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    # **Needs the repository's `volumes` trust flag.** The harness stands up the
    # real image and drives it, so what is tested is what ships — the same
    # binary, the same embedded bundle, the same CSP. Without the flag Woodpecker
    # rejects this pipeline before any step runs, and the failure has no step
    # logs to read, so if this ever reports `error` rather than `failure` the
    # flag is the first thing to check.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - cd web && npm ci
      - npx playwright test
