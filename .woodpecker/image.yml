# Builds the sc-server Docker image and publishes it to GHCR.
#
# Separate from release.yml on purpose: that pipeline publishes the desktop
# client as a tarball for a human to download, this one publishes a container for
# Portainer to pull. They share a tag trigger but nothing else, and coupling them
# would mean a failure in one blocks the other.
#
# Fires on a version tag, and on a push to main (as `:main`, so the developer can
# try a change without cutting a release):
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# REQUIRED SECRET: `jcnash-woodpecker` — a GitHub token with `write:packages`.
# The same secret release.yml uses; a classic token with `write:packages` and
# `repo`, or a fine-grained PAT with package write on this repo.

when:
  - event: tag
    ref: refs/tags/v*
  - event: push
    branch: main

steps:
  - name: image
    image: docker:27-cli
    environment:
      GITHUB_TOKEN:
        from_secret: jcnash-woodpecker
    volumes:
      # The agent's Docker socket. This box already runs Portainer, so a
      # docker-in-docker service would be a second daemon for no reason.
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      # Woodpecker's envsubst preprocessor does not understand shell parameter
      # expansion, so this uses only bare doubled refs ($$VAR) and plain `if`
      # checks — see the long note in release.yml.
      - |
        set -eu
        REPO="$$CI_REPO"
        OWNER="$${REPO%%/*}"
        IMAGE="ghcr.io/$$OWNER/sc-server"

        if [ -z "$$GITHUB_TOKEN" ]; then
          echo "the jcnash-woodpecker secret is not set in Woodpecker" >&2
          exit 1
        fi

        # A tag build publishes both the version and :latest; a main build
        # publishes only :main, so `latest` never silently moves to an untagged
        # commit that nobody chose to release.
        if [ -n "$$CI_COMMIT_TAG" ]; then
          TAGS="$$CI_COMMIT_TAG latest"
        else
          TAGS="main"
        fi

        echo "$$GITHUB_TOKEN" | docker login ghcr.io -u "$$OWNER" --password-stdin

        BUILD_ARGS=""
        for t in $$TAGS; do
          BUILD_ARGS="$$BUILD_ARGS -t $$IMAGE:$$t"
        done
        docker build $$BUILD_ARGS .

        for t in $$TAGS; do
          docker push "$$IMAGE:$$t"
        done

        # Prove the published image actually starts, rather than discovering it
        # does not when Portainer pulls it. It must refuse to run without a key,
        # and run with one.
        FIRST=$$(echo $$TAGS | cut -d' ' -f1)
        if docker run --rm "$$IMAGE:$$FIRST" 2>/dev/null; then
          echo "the image started without SC_SERVER_DAEMON_KEY - it must refuse" >&2
          exit 1
        fi
        echo "verified: refuses to start unconfigured"
