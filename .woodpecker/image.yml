# Builds the sc-server Docker image and publishes it to GHCR.
#
# Separate from release.yml on purpose: that pipeline publishes the desktop
# client as a tarball for a human to download, this one publishes a container for
# Portainer to pull. Coupling them would mean a failure in one blocks the other.
#
# Fires on a version tag, and on a push to main (as `:main`, so a change can be
# tried without cutting a release):
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# **Path-filtered.** This is a monorepo, so a change to the desktop client must
# not rebuild and republish the server's image — and vice versa. The filter is
# what keeps living in one repository from meaning "every push runs everything".
#
# **Built with kaniko, not the host Docker daemon.** Mounting
# `/var/run/docker.sock` needs `trusted.volumes` on the repository, and a
# pipeline that can talk to the host daemon can start a privileged container and
# own the machine — a large grant for building one small image, and one that
# would extend to pull-request builds too. kaniko builds and pushes from
# userspace with no daemon at all, so the pipeline needs no elevated trust.
#
# That was not a theoretical preference: with `volumes:` present, Woodpecker's
# linter rejected **the whole push** before running anything, so between 31 July
# and 1 August the fmt/clippy/test gate silently did not run either. A build that
# needs privilege is a build that stops running.
#
# REQUIRED SECRET: `jcnash-woodpecker` — a GitHub token with `write:packages`;
# a classic token with `write:packages` and `repo`, or a fine-grained PAT with
# package write on this repo.

when:
  - event: tag
    ref: refs/tags/v*
  - event: push
    branch: main
    # The filter must list every input the server's build actually reads. One
    # narrower than that ships a *stale image* — which is silent, and worse than
    # an extra rebuild.
    path:
      include:
        - "crates/sc-server/**"
        # The protocol crate: a wire change alters what the server accepts.
        - "crates/sc-proto/**"
        - "Dockerfile"
        - ".dockerignore"
        - "deploy/**"
        - ".woodpecker/image.yml"
        # A workspace-level change can alter the build for any crate.
        - "Cargo.toml"
        # A dependency bump changes what the server *links* without touching a
        # line of its source — a `ureq` or `tiny_http` patch, or a bare
        # `cargo update`. Omitting this was a silent staleness bug.
        - "Cargo.lock"
        # The Dockerfile pins its own Rust image, so these two can drift apart.
        # A toolchain change should rebuild and surface that.
        - "rust-toolchain.toml"

steps:
  - name: image
    # The **plugin**, not the raw kaniko image. A raw `gcr.io/kaniko-project/
    # executor:*-debug` step fails with exit 2 and *no output at all*: the image
    # has no ordinary shell where Woodpecker expects one, so the command wrapper
    # dies before the executor ever runs. The log ends at the echoed script,
    # which reads like a build failure and is not one.
    #
    # The plugin wraps the same executor with an entrypoint that works, and
    # takes its configuration as settings rather than a shell script — so there
    # is no `$$VAR` quoting to get wrong either.
    image: woodpeckerci/plugin-kaniko:1.6.1
    settings:
      registry: ghcr.io
      repo: ghcr.io/${CI_REPO_OWNER}/sc-server
      dockerfile: Dockerfile
      # A tag build publishes the version *and* `latest`; a push to main
      # publishes only `main`, so `latest` never silently moves to an untagged
      # commit nobody chose to release.
      tags: ${CI_COMMIT_TAG:-main}
      auto_tag: false
      username: ${CI_REPO_OWNER}
      password:
        from_secret: jcnash-woodpecker

  # `latest` is a second push of the same build rather than a second build, so
  # the two tags can never point at different bits.
  - name: latest
    image: woodpeckerci/plugin-kaniko:1.6.1
    when:
      - event: tag
        ref: refs/tags/v*
    settings:
      registry: ghcr.io
      repo: ghcr.io/${CI_REPO_OWNER}/sc-server
      dockerfile: Dockerfile
      tags: latest
      auto_tag: false
      username: ${CI_REPO_OWNER}
      password:
        from_secret: jcnash-woodpecker


# **The smoke test moved out of CI, and that is a real loss worth naming.**
#
# The old pipeline ran the built image and asserted it refuses to start without
# `SC_SERVER_DAEMON_KEY`. kaniko cannot do that — it has no daemon to run
# anything — and a step that needs one would reintroduce the socket mount this
# file exists to avoid.
#
# So the check now lives where the image is deployed rather than where it is
# built. `crates/sc-server` has a unit test asserting the same refusal, which
# catches the regression; what is no longer caught is a *packaging* fault that
# leaves a correct binary unable to start. Run this after pulling a new tag:
#
#     docker run --rm ghcr.io/jamez667/sc-server:latest   # must print and exit 2
#
# A disabled step that looks like a gate would be worse than an absent one.
