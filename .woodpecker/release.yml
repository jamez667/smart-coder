# Release pipeline — builds BOTH desktop products and publishes them to GitHub
# Releases. Fires ONLY when a version tag is pushed:
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# Currently Linux-only (the iced/wgpu GUI is hard to cross-compile to Windows
# from a Linux agent; a Windows build waits for a Windows runner). The binary is
# dynamically linked against the X11/Wayland/font libs installed below, so a user
# running it needs those libraries present (documented in the release notes).
#
# REQUIRED SECRET: add a Woodpecker repo secret named `github_token` — a GitHub
# token with `contents: write` on this repo (fine-grained PAT scoped to the repo,
# or a classic token with the `repo` scope). It authenticates the `gh` release +
# prune calls below. Without it this pipeline fails at the publish step.

when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: release-linux
    image: rust:1.97.1-bookworm
    environment:
      CARGO_TERM_COLOR: always
      # Woodpecker v3: secrets are consumed via `from_secret` (the old top-level
      # `secrets:` list is gone). `from_secret` must match the secret's name in
      # Woodpecker EXACTLY (case-sensitive). The repo secret here is named
      # `jcnash-woodpecker`; it holds a GitHub token with contents:write and is
      # exposed to the publish step below as the GITHUB_TOKEN env var.
      GITHUB_TOKEN:
        from_secret: jcnash-woodpecker
    commands:
      # Build deps for the GUI crate, plus git/gh for publishing.
      - apt-get update
      - >-
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        pkg-config git curl ca-certificates
        libx11-dev libxcb1-dev libxrandr-dev libxi-dev
        libxkbcommon-dev libwayland-dev
        libfontconfig1-dev libfreetype6-dev
      # Install the GitHub CLI (from GitHub's apt repo).
      - >-
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg
        | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
      - >-
        echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
        https://cli.github.com/packages stable main"
        > /etc/apt/sources.list.d/github-cli.list
      - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh

      # Build BOTH products and strip them (44MB unstripped -> ~34MB each).
      #
      # `smart-coder` is the agent app; `smart-coder-crafter` is the editor, which links
      # no model code at all (spec 21). They are separate crates, so this is two builds --
      # but they share `sc-craft-ui`, so the second is mostly cache hits.
      - cargo build --release -p sc-win -p sc-crafter
      - strip target/release/smart-coder
      - strip target/release/smart-coder-crafter

      # Package + publish + prune in ONE shell entry (each `commands:` entry is a
      # fresh shell, so the vars must all live together). CI_COMMIT_TAG, CI_REPO
      # and GITHUB_TOKEN are real ENV VARS in the shell.
      #
      # Woodpecker runs commands through its envsubst preprocessor, which scans
      # dollar/brace expressions and does NOT understand shell parameter
      # expansion (the colon-question default/error form) — that yields "unable
      # to parse variable name" and the pipeline won't even start. So this block
      # uses ONLY bare doubled refs like  $$VAR  (no braces), and does the
      # empty-checks with a plain `if`. Woodpecker collapses each  $$  to one
      # dollar before handing the script to /bin/sh.
      - |
        set -eu
        TAG="$$CI_COMMIT_TAG"
        REPO="$$CI_REPO"
        if [ -z "$$TAG" ]; then echo "CI_COMMIT_TAG is empty - not a tag build?" >&2; exit 1; fi
        if [ -z "$$GITHUB_TOKEN" ]; then echo "github_token secret is not set in Woodpecker" >&2; exit 1; fi
        export GH_TOKEN="$$GITHUB_TOKEN"

        # The shared-library note is the same for both: both are the same iced GUI.
        SO1='Needs these shared libraries installed (Debian/Ubuntu names):'
        SO2='  libx11-6 libxcb1 libxrandr2 libxi6 libxkbcommon0'
        SO3='  libwayland-client0 libwayland-cursor0 libwayland-egl1'
        SO4='  libfontconfig1 libfreetype6'

        # Two products, two tarballs (spec 21). Packaged in a loop so they cannot
        # drift -- the only per-product values are the binary name and one line of
        # description.
        ASSETS=""
        for BIN in smart-coder smart-coder-crafter; do
          if [ "$$BIN" = "smart-coder" ]; then
            WHAT='Smart Coder desktop client -- the editor plus the agent.'
          else
            WHAT='Smart Coder Crafter -- the editor. Contacts no language model.'
          fi
          PKG="$$BIN-$$TAG-linux-x86_64"
          mkdir -p "dist/$$PKG"
          cp "target/release/$$BIN" "dist/$$PKG/"
          cp LICENSE "dist/$$PKG/"
          printf '%s\n' "$$WHAT" 'Linux x86_64.' "Run: ./$$BIN" \
            "$$SO1" "$$SO2" "$$SO3" "$$SO4" > "dist/$$PKG/README.txt"
          tar -czf "dist/$$PKG.tar.gz" -C dist "$$PKG"
          ASSETS="$$ASSETS dist/$$PKG.tar.gz"
        done

        # Publish to GitHub Releases (create with both assets, or upload them if the
        # release already exists). Unquoted $$ASSETS on purpose: it is a list.
        gh release create "$$TAG" $$ASSETS \
          --repo "$$REPO" --title "$$TAG" --generate-notes \
          || gh release upload "$$TAG" $$ASSETS --repo "$$REPO" --clobber

        # Retention: keep only the 3 newest releases; delete older releases AND
        # their tags (--cleanup-tag) so old assets don't accumulate and eat disk.
        gh release list --repo "$$REPO" --limit 100 \
          --json tagName,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r old; do
              [ -n "$$old" ] || continue
              echo "pruning old release $$old"
              gh release delete "$$old" --repo "$$REPO" --yes --cleanup-tag
            done
